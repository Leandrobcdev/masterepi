async function cloudSave(key, value){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return false;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),10000);
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({key,value}),signal:ctrl.signal});
    clearTimeout(tid);
    return true;
  }catch{return false;}
}
async function cloudLoad(key){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return null;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch(`${url}?key=${encodeURIComponent(key)}&ts=${Date.now()}`,{signal:ctrl.signal});
    clearTimeout(tid);
    const text=await r.text();
    if(!text||text==="null"||text.trim()==="")return null;
    return JSON.parse(text);
  }catch{return null;}
}

function today(){return new Date().toLocaleDateString("pt-BR");}
function parseDate(str){if(!str)return 0;const[d,m,y]=str.split("/");return new Date(`${y}-${m}-${d}`).getTime()||0;}
function diffDays(a,b){const da=parseDate(a),db=parseDate(b);if(!da||!db)return null;return Math.round((db-da)/86400000);}
function diasAberto(emissao){if(!emissao)return null;const h=new Date();h.setHours(0,0,0,0);const e=parseDate(emissao);return e?Math.floor((h-e)/86400000):null;}
function supplierKey(e){return e?(e.replace(/\(CNPJ:.*?\)/gi,"").trim().toUpperCase().substring(0,40)):"";}
function buildStats(nfs){
  const map={};
  for(const n of nfs){if(!n.emissao||!n.chegou)continue;const d=diffDays(n.emissao,n.chegou);if(d===null||d<0)continue;const k=supplierKey(n.emitente);if(!map[k])map[k]=[];map[k].push(d);}
  const s={};
  for(const[k,a]of Object.entries(map))s[k]={media:Math.round(a.reduce((x,y)=>x+y,0)/a.length),count:a.length};
  return s;
}
function fmtVal(v){if(!v)return"";const n=parseFloat(String(v).replace(/[^0-9,.-]/g,"").replace(",","."));return isNaN(n)?v:"R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}

function parseXML(xmlText){
  try{
    const parser=new DOMParser();
    const doc=parser.parseFromString(xmlText,"text/xml");
    const ns="http://www.portalfiscal.inf.br/nfe";
    const g=(tag,ctx)=>(ctx||doc).getElementsByTagNameNS(ns,tag)[0]?.textContent||"";
    const nNF=g("nNF"); const serie=g("serie");
    const numero=serie?`${nNF}/${serie}`:nNF;
    const emitNode=doc.getElementsByTagNameNS(ns,"emit")[0];
    const destNode=doc.getElementsByTagNameNS(ns,"dest")[0];
    const transpNode=doc.getElementsByTagNameNS(ns,"transporta")[0];
    const emitente=g("xNome",emitNode)||"";
    const emitCNPJ=emitNode?.getElementsByTagNameNS(ns,"CNPJ")[0]?.textContent||"";
    const emitEnder=emitNode?.getElementsByTagNameNS(ns,"enderEmit")[0];
    const emitCidade=g("xMun",emitEnder)+(g("UF",emitEnder)?" / "+g("UF",emitEnder):"");
    const destNome=g("xNome",destNode)||"";
    const destEnder=destNode?.getElementsByTagNameNS(ns,"enderDest")[0];
    const destCidade=g("xMun",destEnder)+(g("UF",destEnder)?" / "+g("UF",destEnder):"");
    const vNF=g("vNF"); const valor=vNF?fmtVal(vNF):"";
    const chNFe=g("chNFe");
    const dhEmi=g("dhEmi");
    const emissao=dhEmi?(()=>{const d=new Date(dhEmi);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;})():"";
    const natureza=g("natOp")||"";
    const transportadora=g("xNome",transpNode)||"";
    const transCNPJ=transpNode?.getElementsByTagNameNS(ns,"CNPJ")[0]?.textContent||"";
    const modFrete=(()=>{const m=g("modFrete");return{0:"0-Emitente",1:"1-Dest/Rem",2:"2-Terceiros",3:"3-Próprio",4:"4-Próprio(Dest)",9:"9-Sem frete"}[m]||m;})();
    const volNode=doc.getElementsByTagNameNS(ns,"vol")[0];
    const qVol=g("qVol",volNode)||""; const pesoB=g("pesoB",volNode)||""; const pesoL=g("pesoL",volNode)||"";
    const nVol=g("nVol",volNode)||"";
    const dups=[...doc.getElementsByTagNameNS(ns,"dup")].map(d=>({nDup:g("nDup",d),dVenc:g("dVenc",d),vDup:fmtVal(g("vDup",d))}));
    const itens=[...doc.getElementsByTagNameNS(ns,"det")].map(det=>{
      const prod=det.getElementsByTagNameNS(ns,"prod")[0];
      return{
        item:det.getAttribute("nItem")||"",
        codigo:g("cProd",prod),
        descricao:g("xProd",prod),
        ncm:g("NCM",prod),
        cfop:g("CFOP",prod),
        unid:g("uCom",prod),
        qtd:g("qCom",prod),
        vUnit:fmtVal(g("vUnCom",prod)),
        vProd:fmtVal(g("vProd",prod)),
        pedido:g("xPed",prod)||"",
      };
    });
    const tot=doc.getElementsByTagNameNS(ns,"ICMSTot")[0];
    const totais={vProd:fmtVal(g("vProd",tot)),vFrete:fmtVal(g("vFrete",tot)),vDesc:fmtVal(g("vDesc",tot)),vIPI:fmtVal(g("vIPI",tot)),vPIS:fmtVal(g("vPIS",tot)),vCOFINS:fmtVal(g("vCOFINS",tot)),vNF:fmtVal(g("vNF",tot))};
    const infCpl=g("infCpl")||"";
    return{numero,emissao,emitente,emitCNPJ,emitCidade,destNome,destCidade,valor,chNFe,natureza,transportadora,transCNPJ,modFrete,qVol,pesoB,pesoL,nVol,dups,itens,totais,infCpl,xmlOk:true};
  }catch(e){return null;}
}

function parseNFs(text){
  const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);const r=[];
  for(const line of lines){
    if(/^(número|emissão|emitente)/i.test(line))continue;
    const p=line.split(/\t/);
    if(p.length>=5){r.push({numero:p[0]?.trim()||"",emissao:p[1]?.trim()||"",emitente:p[2]?.trim()||"",natureza:p[3]?.trim()||"",valor:p[4]?.trim()||"",pedido:"",obs:"",chegou:""});continue;}
    const dm=line.match(/(\d{2}\/\d{2}\/\d{4})/);const vm=line.match(/(R\$\s*[\d.,]+)/i);if(!dm)continue;
    const di=line.indexOf(dm[0]);const num=line.substring(0,di).trim();const after=line.substring(di+dm[0].length).trim();
    const cm=after.match(/^(.*?\(CNPJ:\s*[\d.\/-]+\))/i);
    let emit="",valor=vm?vm[0]:"";
    if(cm){emit=cm[1].trim();}else if(vm){const vi=after.indexOf(vm[0]);emit=after.substring(0,vi).trim();}
    if(num)r.push({numero:num,emissao:dm[0],emitente:emit,natureza:"",valor,pedido:"",obs:"",chegou:""});
  }
  return r;
}
function parseFretes(text){
  const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);const r=[];
  for(const line of lines){
    if(/^(número|emissão|emitente)/i.test(line))continue;
    const p=line.split(/\t/);
    if(p.length>=5){r.push({nf:p[0]?.trim()||"",emissao:p[1]?.trim()||"",transportadora:p[2]?.trim()||"",valor:p[4]?.trim()||"",pedido:"",rastreio:"",obs:"",chegou:"",origem:"",destino:"",previsao:"",nfAssociada:""});continue;}
    const dm=line.match(/(\d{2}\/\d{2}\/\d{4})/);const vm=line.match(/(R\$\s*[\d.,]+)/i);if(!dm)continue;
    const di=line.indexOf(dm[0]);const nf=line.substring(0,di).trim();const after=line.substring(di+dm[0].length).trim();
    let trans="",valor=vm?vm[0]:"";
    if(vm){const vi=after.indexOf(vm[0]);trans=after.substring(0,vi).trim();}
    if(nf||trans)r.push({nf,emissao:dm[0],transportadora:trans,valor,pedido:"",rastreio:"",obs:"",chegou:"",origem:"",destino:"",previsao:"",nfAssociada:""});
  }
  return r;
}

function ChegouInput({value,onSave}){
  const[draft,setDraft]=useState(value||"");
  useEffect(()=>{setDraft(value||"");},[value]);
  const handleChange=e=>{let v=e.target.value;setDraft(v);if(v.length===10){onSave(v);}if(v.length===0&&value){onSave("");}};
  const handleBlur=()=>{if(draft.length===10){onSave(draft);}else if(draft.length===0&&value){onSave("");}else{setDraft(value||"");}};
  const handleKeyDown=e=>{if(e.key==="Enter"&&draft.length===10){onSave(draft);}if(e.key==="Escape"){setDraft(value||"");}};
  return <input value={draft} onChange={handleChange} onBlur={handleBlur} onKeyDown={handleKeyDown} placeholder="dd/mm/aaaa" style={{background:"transparent",border:`1px solid ${draft.length>0&&draft.length<10?"#cc0000":"#2a2a2a"}`,borderRadius:6,padding:"4px 8px",color:"#4ade80",fontSize:12,width:95,textAlign:"center"}}/>;
}

  const[danfeNf,setDanfeNf]=useState(null);
  const xmlRef=useRef();

  const rowRefs=useRef({});
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500);};
  const inp={width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"8px 10px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};

  // Passo 1: quando highlightNF chega, ajusta aba + busca
  // NÃO seta pendingScroll ainda — espera o filtered atualizar
  useEffect(()=>{
    if(!highlightNF)return;
    const nf=nfs.find(n=>n.numero.trim()===highlightNF.trim());
    setSub(nf?.chegou?"finalizados":"pendentes");
    setSearch(highlightNF);
  },[highlightNF]);

  // Passo 2: quando search muda para o valor do highlightNF, agenda o scroll
  // Isso garante que filtered já está atualizado com a NF visível
  useEffect(()=>{
    if(!highlightNF)return;
    if(search!==highlightNF)return; // ainda não sincronizou
    let raf1,raf2;
    raf1=requestAnimationFrame(()=>{
      raf2=requestAnimationFrame(()=>{
        const el=rowRefs.current[highlightNF];
        if(el){
          el.scrollIntoView({behavior:"smooth",block:"center"});
          el.classList.remove("nf-highlight");
          void el.offsetWidth;
          el.classList.add("nf-highlight");
        }
      });
    });
    return()=>{cancelAnimationFrame(raf1);if(raf2)cancelAnimationFrame(raf2);};
  },[search, highlightNF]);

  const handleChegou=(nfId,chegou)=>{
    setNfs(prev=>prev.map(n=>n.id===nfId?{...n,chegou}:n));
    const nf=nfs.find(n=>n.id===nfId);
    if(nf)setFretes(prev=>prev.map(fr=>fr.nfAssociada===nf.numero?{...fr,chegou}:fr));
  };

  const handleXMLFiles=(files)=>{
    let ok=0,notFound=0;
    const promises=[...files].map(file=>new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const xmlData=parseXML(e.target.result);
        if(!xmlData){resolve();return;}
        setNfs(prev=>{
          const idx=prev.findIndex(n=>n.numero.trim()===xmlData.numero.trim());
          if(idx===-1){notFound++;resolve();return prev;}
          ok++;
          const updated=[...prev];
          updated[idx]={...updated[idx],xmlData,
            emitente:xmlData.emitente||updated[idx].emitente,
            valor:xmlData.valor||updated[idx].valor,
            natureza:xmlData.natureza||updated[idx].natureza,
            pedido:xmlData.itens?.[0]?.pedido||updated[idx].pedido,
          };
          resolve();
          return updated;
        });
      };
      reader.readAsText(file);
    }));
    Promise.all(promises).then(()=>{
      setTimeout(()=>showToast(`✅ ${ok} XML(s) associado(s)${notFound>0?" · "+notFound+" não encontrado(s)":""}`),200);
    });
  };

  const stats=buildStats(nfs);
  const pendentes=nfs.filter(n=>!n.chegou);
  const finalizados=nfs.filter(n=>!!n.chegou);
  const base=sub==="pendentes"?pendentes:finalizados;
  const filtered=base.filter(n=>!search||n.numero.includes(search)||n.emitente.toLowerCase().includes(search.toLowerCase())||(n.pedido||"").includes(search))
    .sort((a,b)=>{const da=parseDate(a.emissao)||parseDate(a.dataCadastro);const db=parseDate(b.emissao)||parseDate(b.dataCadastro);return sort==="oldest"?da-db:db-da;});
  const getLinked=(num)=>fretes.find(f=>f.nfAssociada&&f.nfAssociada.trim()===num.trim());

  const handlePaste=(t)=>{setPasteText(t);setPastePreview(t.trim()?parseNFs(t):[]);};
  const handleImport=()=>{
    const exist=new Set(nfs.map(n=>n.numero.trim()));
    const novas=pastePreview.filter(n=>!exist.has(n.numero.trim()));
    const dups=pastePreview.length-novas.length;
    if(!novas.length){showToast("⚠️ Todas já existem!");return;}
    setNfs(prev=>[...novas.map(n=>({...n,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
    setPasteText("");setPastePreview([]);setShowPaste(false);
    showToast(`✅ ${novas.length} importada(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);
  };
  const handleSave=()=>{
    if(!form.numero||!form.emitente)return alert("Preencha Número e Emitente.");
    if(editId)setNfs(prev=>prev.map(n=>n.id===editId?{...form,id:editId,dataCadastro:n.dataCadastro}:n));

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
            {[["numero","Número/Série *"],["emissao","Data de Emissão"],["emitente","Emitente *"],["valor","Valor (R$)"],["pedido","Nº Pedido"],["chegou","Data de Chegada"]].map(([k,l])=>(
              <div key={k}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>{l}</label><input value={form[k]||""} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>
            ))}
            <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>Observações</label><input value={form.obs||""} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} style={inp}/></div>
          </div>
          <button onClick={handleSave} style={{marginTop:14,background:"#cc0000",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{editId?"💾 Salvar":"✅ Registrar"}</button>
        </div>
      )}
      <SubTabs active={sub} setActive={setSub} pendentes={pendentes.length} finalizados={finalizados.length} color="#cc0000"/>

      {/* ── MODIFICAÇÃO: banner de destaque quando veio de Pedidos ── */}
      {highlightNF&&(
        <div style={{display:"flex",alignItems:"center",gap:10,background:"#1a0d00",border:"1px solid #cc0000",borderRadius:8,padding:"8px 16px",margin:"10px 0",fontSize:13}}>
          <span style={{fontSize:18}}>🔍</span>
          <span style={{color:"#ff9999",fontWeight:700}}>Mostrando NF <span style={{color:"#fbbf24"}}>{highlightNF}</span> — vinda dos Pedidos</span>
          <button onClick={()=>{setSearch("");if(onHighlightDone)onHighlightDone();}} style={{marginLeft:"auto",background:"transparent",border:"1px solid #cc0000",borderRadius:6,color:"#cc0000",padding:"3px 10px",cursor:"pointer",fontSize:12}}>✕ Limpar</button>
        </div>
      )}

      <div style={{display:"flex",gap:10,margin:"14px 0",flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar NF, emitente ou pedido..." style={{flex:1,minWidth:180,background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13}}/>
        <button onClick={()=>setSort(s=>s==="newest"?"oldest":"newest")} style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>{sort==="newest"?"📅 Mais recente":"📅 Mais antigo"}</button>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
          <div style={{fontSize:44}}>{sub==="pendentes"?"📋":"✅"}</div>
          <p style={{marginTop:10,fontSize:14}}>
            {highlightNF?`NF ${highlightNF} não encontrada. Ela pode ainda não ter sido importada.`:sub==="pendentes"?"Nenhuma NF pendente.":"Nenhuma NF finalizada ainda."}
          </p>
        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#141414",borderBottom:"2px solid #cc0000"}}>
                {["Número/Série","Emissão","Dias","Emitente","Previsão Fornec.","Valor","Pedido","Frete Vinc.","Chegou em","Obs",""].map(h=>(
                  <th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((nf,i)=>{
                const linkedFrete=getLinked(nf.numero);
                const key=supplierKey(nf.emitente);
                const st=stats[key];
                const dias=nf.chegou?diffDays(nf.emissao,nf.chegou):diasAberto(nf.emissao);
                const hasXml=!!nf.xmlData;
                const isHighlighted=highlightNF&&nf.numero.trim()===highlightNF.trim();
                return(
                  // ── MODIFICAÇÃO: ref na linha para scroll + classe de flash
                  <tr
                    key={nf.id}
                    ref={el=>{ if(el) rowRefs.current[nf.numero]=el; }}
                    style={{borderBottom:"1px solid #1a1a1a",background:isHighlighted?"#2a1200":i%2===0?"#0a0a0a":"#111",transition:"background 0.3s"}}
                  >
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"nowrap"}}>
                        <button onClick={()=>setDanfeNf(nf)} style={{background:"transparent",border:"none",cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:4}}>
                          <span style={{color:hasXml?"#cc0000":"#666",fontWeight:700,fontSize:13,textDecoration:"underline",textUnderlineOffset:2}}>{nf.numero}</span>
                          {hasXml?<span style={{fontSize:10,background:"#1a0000",color:"#ff6666",border:"1px solid #cc0000",borderRadius:4,padding:"1px 5px"}}>XML</span>:<span style={{fontSize:10,color:"#444",border:"1px dashed #333",borderRadius:4,padding:"1px 5px"}}>sem XML</span>}
                        </button>
                        {navegarParaPedido&&<button onClick={()=>navegarParaPedido(nf.numero.trim())} title="Ver Pedido desta NF" style={{background:"#1c1200",border:"1px solid #f59e0b",borderRadius:5,padding:"3px 9px",color:"#fbbf24",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:3}}>📦 Pedido ↗</button>}
                      </div>
                    </td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{nf.emissao}</td>
                    <td style={{padding:"9px 12px",textAlign:"center"}}>
                      {nf.chegou?<span style={{background:"#0f2922",border:"1px solid #10b981",borderRadius:6,padding:"3px 9px",color:"#34d399",fontWeight:700,fontSize:12}}>{dias}d ✓</span>:<DiasBadge dias={dias}/>}
                    </td>
                    <td style={{padding:"9px 12px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={nf.emitente}>{nf.emitente}</td>
                    <td style={{padding:"9px 12px"}}>{st?<MediaBadge media={st.media} count={st.count}/>:<span style={{color:"#333",fontSize:11}}>sem histórico</span>}</td>
                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{nf.valor}</td>
                    <td style={{padding:"9px 12px"}}><input value={nf.pedido||""} onChange={e=>upd(nf.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {linkedFrete?<span style={{background:"#0c2a3a",border:"1px solid #0891b2",borderRadius:6,padding:"3px 9px",color:"#38bdf8",fontWeight:700,fontSize:12}}>🚚 {linkedFrete.nf||linkedFrete.transportadora?.split(" ")[0]}</span>:<span style={{color:"#333",fontSize:12}}>—</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={nf.chegou} onSave={v=>handleChegou(nf.id,v)}/></td>
                    <td style={{padding:"9px 12px"}}><input value={nf.obs||""} onChange={e=>upd(nf.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{setForm({...nf});setEditId(nf.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setNfs(prev=>prev.filter(n=>n.id!==nf.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── FRETES TAB ───────────────────────────────────────────────────────────────
const FR_EMPTY={transportadora:"",nf:"",nfAssociada:"",pedido:"",origem:"",destino:"",previsao:"",valor:"",rastreio:"",obs:"",chegou:""};
function FretesTab({fretes,setFretes,nfs,setNfs}){
  const[sub,setSub]=useState("pendentes");
  const[showForm,setShowForm]=useState(false);
  const[showPaste,setShowPaste]=useState(false);
  const[pasteText,setPasteText]=useState("");
  const[pastePreview,setPastePreview]=useState([]);
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(FR_EMPTY);
  const[search,setSearch]=useState("");
  const[toast,setToast]=useState(null);
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500);};
  const inp={width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"8px 10px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};

  const handleChegou=(frId,chegou)=>{
    setFretes(prev=>prev.map(f=>f.id===frId?{...f,chegou}:f));
    const fr=fretes.find(f=>f.id===frId);
    if(fr&&fr.nfAssociada)setNfs(prev=>prev.map(n=>n.numero===fr.nfAssociada?{...n,chegou}:n));
  };
  const handleNfAssociada=(frId,nfNum)=>{
    setFretes(prev=>prev.map(f=>{
      if(f.id!==frId)return f;
      const matchNf=nfs.find(n=>n.numero===nfNum);
      return{...f,nfAssociada:nfNum,chegou:matchNf?.chegou||f.chegou};
    }));
  };
  const handlePaste=(t)=>{setPasteText(t);setPastePreview(t.trim()?parseFretes(t):[]);};
  const handleImport=()=>{
    const exist=new Set(fretes.map(f=>f.nf.trim()));
    const novos=pastePreview.filter(f=>!exist.has(f.nf.trim()));
    const dups=pastePreview.length-novos.length;
    if(!novos.length){showToast("⚠️ Todos já existem!");return;}
    setFretes(prev=>[...novos.map(f=>({...f,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
    setPasteText("");setPastePreview([]);setShowPaste(false);
    showToast(`✅ ${novos.length} importado(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);
  };
  const handleSave=()=>{
    if(!form.transportadora)return alert("Informe a transportadora.");
    if(editId)setFretes(prev=>prev.map(f=>f.id===editId?{...form,id:editId,dataCadastro:f.dataCadastro}:f));
    else setFretes(prev=>[{...form,id:Date.now(),dataCadastro:today()},...prev]);
    setEditId(null);setShowForm(false);setForm(FR_EMPTY);
    showToast("Frete salvo!");
  };
  const upd=(id,f,v)=>setFretes(prev=>prev.map(fr=>fr.id===id?{...fr,[f]:v}:fr));

  const pendentes=fretes.filter(f=>!f.chegou);
  const finalizados=fretes.filter(f=>!!f.chegou);
  const base=sub==="pendentes"?pendentes:finalizados;
  const filtered=base.filter(f=>!search||f.transportadora.toLowerCase().includes(search.toLowerCase())||(f.nf||"").includes(search)||(f.pedido||"").includes(search)||(f.nfAssociada||"").includes(search));

  return(
    <div>
      {toast&&<div style={{position:"fixed",top:20,right:20,background:"#065f46",color:"#fff",padding:"12px 20px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:998,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}
      <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        {[["⏳","Pendentes","#fbbf24",pendentes.length],["✅","Finalizados","#34d399",finalizados.length],["🚚","Total","#fff",fretes.length]].map(([ic,lb,cl,ct])=>(
          <div key={lb} style={{background:"#141414",borderRadius:8,padding:"10px 18px",display:"flex",alignItems:"center",gap:8,border:"1px solid #2a2a2a"}}>
            <span>{ic}</span><span style={{fontSize:13,color:"#94a3b8"}}>{lb}</span><span style={{fontWeight:700,fontSize:20,color:cl}}>{ct}</span>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={()=>{setShowPaste(!showPaste);setShowForm(false);}} style={{background:showPaste?"#990000":"#cc0000",color:"#fff",border:"none",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📋 Colar Lista</button>
        <button onClick={()=>{setShowForm(!showForm);setShowPaste(false);setEditId(null);setForm(FR_EMPTY);}} style={{background:"#141414",color:"#e2e8f0",border:"1px solid #2a2a2a",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>+ Manual</button>
      </div>
      {showPaste&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #cc0000"}}>
          <h3 style={{margin:"0 0 6px",fontSize:15,color:"#ff9999"}}>📋 Colar Lista de Fretes</h3>
          <p style={{margin:"0 0 12px",fontSize:13,color:"#555"}}>Cole o conteúdo copiado do sistema:</p>
          <textarea value={pasteText} onChange={e=>handlePaste(e.target.value)} placeholder="Cole aqui..." rows={4} style={{...inp,resize:"vertical",fontFamily:"monospace",fontSize:12}}/>
          {pastePreview.length>0&&(()=>{
            const exist=new Set(fretes.map(f=>f.nf.trim()));
            const novos=pastePreview.filter(f=>!exist.has(f.nf.trim()));
            const dups=pastePreview.filter(f=>exist.has(f.nf.trim()));
            return <div style={{marginTop:14}}>
              <p style={{margin:"0 0 8px",fontSize:13,color:"#34d399",fontWeight:600}}>✅ {novos.length} novo(s) {dups.length>0&&<span style={{color:"#f87171"}}> · ⚠️ {dups.length} duplicata(s) serão ignoradas</span>}</p>
              <div style={{overflowX:"auto",maxHeight:200,overflowY:"auto",borderRadius:8,border:"1px solid #2a2a2a"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead><tr style={{background:"#0a0a0a"}}>{["","CT-e","Emissão","Transportadora","Valor"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#555",fontWeight:600}}>{h}</th>)}</tr></thead>
                  <tbody>{pastePreview.map((f,i)=>{const isDup=exist.has(f.nf.trim());return <tr key={i} style={{borderBottom:"1px solid #1a1a1a",opacity:isDup?0.4:1}}><td style={{padding:"6px 10px"}}>{isDup?<span style={{color:"#f87171",fontSize:11}}>DUP</span>:<span style={{color:"#34d399",fontSize:11}}>NEW</span>}</td><td style={{padding:"6px 10px",color:"#ff9999",fontWeight:600}}>{f.nf}</td><td style={{padding:"6px 10px",color:"#94a3b8"}}>{f.emissao}</td><td style={{padding:"6px 10px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.transportadora}</td><td style={{padding:"6px 10px",color:"#34d399"}}>{f.valor}</td></tr>;})}</tbody>
                </table>
              </div>
              {novos.length>0&&<button onClick={handleImport} style={{marginTop:12,background:"#059669",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>✅ Importar {novos.length} frete(s)</button>}
            </div>;
          })()}
          {pasteText&&pastePreview.length===0&&<p style={{color:"#f87171",fontSize:13,marginTop:10}}>⚠️ Não foi possível detectar fretes.</p>}
        </div>
      )}
      {showForm&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #2a2a2a"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,color:"#ff9999"}}>{editId?"✏️ Editar Frete":"🚚 Novo Frete"}</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
            {[["transportadora","Transportadora *"],["nf","Nº CT-e"],["nfAssociada","NF Vinculada"],["pedido","Nº Pedido"],["origem","Origem"],["destino","Destino"],["previsao","Previsão"],["valor","Valor (R$)"],["rastreio","Rastreio"],["chegou","Data de Chegada"]].map(([k,l])=>(
              <div key={k}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>{l}</label><input value={form[k]||""} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>
            ))}
            <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>Observações</label><input value={form.obs||""} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} style={inp}/></div>
          </div>
          <button onClick={handleSave} style={{marginTop:14,background:"#cc0000",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{editId?"💾 Salvar":"✅ Registrar"}</button>
        </div>
      )}
      <SubTabs active={sub} setActive={setSub} pendentes={pendentes.length} finalizados={finalizados.length} color="#cc0000"/>
      <div style={{display:"flex",gap:10,margin:"14px 0"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar transportadora, CT-e ou NF..." style={{flex:1,minWidth:200,background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13}}/>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
          <div style={{fontSize:44}}>{sub==="pendentes"?"🚚":"✅"}</div>
          <p style={{marginTop:10,fontSize:14}}>{sub==="pendentes"?"Nenhum frete pendente.":"Nenhum frete finalizado ainda."}</p>
        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#141414",borderBottom:"2px solid #cc0000"}}>
                {["Transportadora","CT-e","NF Vinculada","Pedido","Origem → Destino","Previsão","Valor","Rastreio","Obs","Data Chegada","Status",""].map(h=>(
                  <th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((fr,i)=>{
                const chegou=!!fr.chegou;
                return(
                  <tr key={fr.id} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>
                    <td style={{padding:"9px 12px",fontWeight:600,color:"#ff4444",whiteSpace:"nowrap"}}>{fr.transportadora}</td>
                    <td style={{padding:"9px 12px",color:"#ff9999",whiteSpace:"nowrap"}}>{fr.nf||"—"}</td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><LinkBadge value={fr.nfAssociada} placeholder="+ vincular NF" color="#60a5fa" bg="#1e3a5f" borderColor="#3b82f6" icon="🔗" onChange={v=>handleNfAssociada(fr.id,v)} onClear={()=>upd(fr.id,"nfAssociada","")}/></td>
                    <td style={{padding:"9px 12px"}}><input value={fr.pedido||""} onChange={e=>upd(fr.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",fontSize:12,whiteSpace:"nowrap"}}>{fr.origem&&fr.destino?`${fr.origem} → ${fr.destino}`:fr.origem||fr.destino||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{fr.previsao||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{fr.valor||"—"}</td>
                    <td style={{padding:"9px 12px"}}><input value={fr.rastreio||""} onChange={e=>upd(fr.id,"rastreio",e.target.value)} placeholder="Rastreio..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#c4b5fd",fontSize:12,width:100}}/></td>
                    <td style={{padding:"9px 12px"}}><input value={fr.obs||""} onChange={e=>upd(fr.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={fr.chegou} onSave={v=>handleChegou(fr.id,v)}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {chegou?<span style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:6,padding:"4px 12px",color:"#4ade80",fontWeight:700,fontSize:12}}>📦 Chegou</span>:<span style={{background:"#1c1917",border:"1px solid #f59e0b",borderRadius:6,padding:"4px 12px",color:"#fbbf24",fontWeight:700,fontSize:12}}>⏳ Pendente</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{setForm({...fr});setEditId(fr.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setFretes(prev=>prev.filter(f=>f.id!==fr.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const[tab,setTab]=useState("pedidos");
  const[nfs,setNfs]=useState([]);
  const[fretes,setFretes]=useState([]);
  const[dataLoaded,setDataLoaded]=useState(false);
  const[showSettings,setShowSettings]=useState(false);

{`function doGet(e){
  const key=e.parameter.key;
  if(!key||key==="test")return out("ok");
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  let sh=ss.getSheetByName("MasterEPI");
  if(!sh)sh=ss.insertSheet("MasterEPI");
  const rows=sh.getDataRange().getValues();
  for(let r of rows){if(r[0]===key)return out(r[1]);}
  return out("null");
}
function doPost(e){
  try{
    const raw=e.postData?e.postData.contents:"{}";
    const b=JSON.parse(raw);
    if(!b.key)return out("error:no key");
    const val=JSON.stringify(b.value);
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    let sh=ss.getSheetByName("MasterEPI");
    if(!sh)sh=ss.insertSheet("MasterEPI");
    const data=sh.getDataRange().getValues();
    for(let i=0;i<data.length;i++){
      if(data[i][0]===b.key){
        sh.getRange(i+1,2).setValue(val);
        SpreadsheetApp.flush();
        return out("ok");
      }
    }
    sh.appendRow([b.key,val]);
    SpreadsheetApp.flush();
    return out("ok");
  }catch(err){return out("error:"+err.toString());}
}
function out(v){
  return ContentService.createTextOutput(v)
    .setMimeType(ContentService.MimeType.TEXT);
}`}

      </div>
    </div>
  );

    setCal(prev=>({...prev,[dia]:(prev[dia]||[]).filter((_,i)=>i!==idx)}));
  };

  const hoje=new Date();
  const inicioSemana=new Date(hoje);
  inicioSemana.setDate(hoje.getDate()-hoje.getDay()+1);
  inicioSemana.setHours(0,0,0,0);

  const pedidosSemana=(marca)=>{

      const dt=new Date(`${yyyy}-${mm}-${dd}`);
      const fornUpper=(g.fornecedor||"").toUpperCase();
      return dt>=inicioSemana && (fornUpper.includes(marcaUpper)||marcaUpper.includes(fornUpper.split(" ")[0]));
    });
  };
  const todosPedidosMarca=(marca)=>{
    const marcaUpper=marca.toUpperCase();
    return grupos.filter(g=>{
      const fornUpper=(g.fornecedor||"").toUpperCase();
      return fornUpper.includes(marcaUpper)||marcaUpper.includes(fornUpper.split(" ")[0]);
    }).sort((a,b)=>{ const pa=a.dataPedido||"",pb=b.dataPedido||""; return pb.split("/").reverse().join("")-pa.split("/").reverse().join(""); });
  };

  const corDia=(dia)=>{
    const cores={seg:"#3b82f6",ter:"#8b5cf6",qua:"#10b981",qui:"#f59e0b",sex:"#cc0000",sab:"#475569",dom:"#475569"};
    return cores[dia]||"#475569";
  };

  return(
    <div style={{marginBottom:24}}>
      {marcasHoje.length>0&&(
        <div style={{background:"linear-gradient(135deg,#1a0a00,#0a0a0a)",border:"2px solid #cc0000",borderRadius:12,padding:"16px 20px",marginBottom:16,position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",top:0,right:0,width:120,height:"100%",background:"linear-gradient(90deg,transparent,rgba(204,0,0,0.08))",pointerEvents:"none"}}/>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
            <span style={{fontSize:22}}>📅</span>
            <div>
              <div style={{color:"#cc0000",fontWeight:900,fontSize:16,letterSpacing:1}}>HOJE É DIA DE PEDIR!</div>
              <div style={{color:"#555",fontSize:11}}>{["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][hoje.getDay()]}, {hoje.toLocaleDateString("pt-BR")}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            {marcasHoje.map((marca,i)=>{
              const peds=pedidosSemana(marca);
              return(
                <div key={i} onClick={()=>setMarcaDetalhe({marca,dia:diaAtual})} style={{background:"#141414",border:`1px solid ${peds.length>0?"#16a34a":"#cc0000"}`,borderRadius:10,padding:"10px 14px",minWidth:140,position:"relative",cursor:"pointer",transition:"opacity 0.15s"}} onMouseEnter={e=>e.currentTarget.style.opacity="0.8"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                  {peds.length>0&&<div style={{position:"absolute",top:-8,right:8,background:"#16a34a",color:"#fff",borderRadius:10,padding:"1px 8px",fontSize:10,fontWeight:700}}>✓ PEDIDO</div>}
                  <div style={{fontWeight:800,color:peds.length>0?"#4ade80":"#fff",fontSize:14,marginBottom:4}}>{marca}</div>
                  {peds.length>0?(
                    <div style={{fontSize:10,color:"#34d399"}}>
                      {peds.slice(0,2).map((p,j)=>(
                        <div key={j} style={{marginTop:2}}>• {p.dataPedido} — {p.numeroPedido||"em aberto"}</div>
                      ))}
                      {peds.length>2&&<div style={{color:"#555"}}>+{peds.length-2} mais</div>}
                    </div>
                  ):(
                    <div style={{fontSize:10,color:"#cc0000",fontWeight:600}}>⚠️ Não pedido ainda</div>
                  )}
                  <div style={{fontSize:9,color:"#334155",marginTop:6}}>👆 ver detalhes</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {marcaDetalhe&&(()=>{
        const {marca}=marcaDetalhe;
        const todos=todosPedidosMarca(marca);
        const desta=pedidosSemana(marca);
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
            <div style={{background:"#141414",border:"1px solid #cc0000",borderRadius:12,width:"100%",maxWidth:720,maxHeight:"85vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
              <div style={{padding:"16px 20px",borderBottom:"1px solid #2a2a2a",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0d0d0d"}}>
                <div>
                  <div style={{fontWeight:900,fontSize:18,color:"#cc0000"}}>{marca}</div>
                  <div style={{fontSize:12,color:"#475569",marginTop:2}}>
                    {desta.length>0?<span style={{color:"#4ade80"}}>✓ {desta.length} pedido(s) esta semana</span>:<span style={{color:"#f87171"}}>⚠️ Ainda não pedido esta semana</span>}
                    {" · "}{todos.length} pedido(s) no histórico
                  </div>
                </div>
                <button onClick={()=>setMarcaDetalhe(null)} style={{background:"#1a1a1a",border:"1px solid #333",borderRadius:8,color:"#94a3b8",padding:"6px 14px",cursor:"pointer",fontSize:13,fontWeight:600}}>✕ Fechar</button>
              </div>
              {desta.length>0&&(
                <div style={{padding:"14px 20px",borderBottom:"1px solid #1a1a1a",background:"#0a1a0a"}}>
                  <div style={{color:"#4ade80",fontWeight:700,fontSize:12,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>✓ Esta Semana</div>
                  {desta.map((g,i)=>(
                    <div key={i} style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:8,padding:"10px 14px",marginBottom:8}}>
                      <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center",marginBottom:g.itens&&g.itens.length>0?8:0}}>
                        <span style={{color:"#4ade80",fontWeight:700,fontSize:13}}>{g.dataPedido}</span>
                        {g.numCotacao&&<span style={{background:"#1e1b4b",border:"1px solid #4f46e5",borderRadius:5,padding:"2px 8px",color:"#a5b4fc",fontSize:11}}>📋 {g.numCotacao}</span>}
                        {g.numeroPedido&&<span style={{color:"#94a3b8",fontSize:12}}>Ped: {g.numeroPedido}</span>}
                        {g.nf&&<span style={{color:"#67e8f9",fontSize:12}}>NF: {g.nf}</span>}
                        {g.valor&&<span style={{color:"#34d399",fontWeight:600,fontSize:12}}>{g.valor}</span>}
                        <span style={{color:"#555",fontSize:11,marginLeft:"auto"}}>{g.fornecedor}</span>
                      </div>
                      {g.itens&&g.itens.length>0&&(
                        <div style={{overflowX:"auto"}}>
                          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                            <thead><tr style={{borderBottom:"1px solid #16a34a"}}>{["Cód","Descrição","Qtd","Saldo"].map(h=><th key={h} style={{padding:"4px 8px",textAlign:"left",color:"#4ade80",fontWeight:600}}>{h}</th>)}</tr></thead>
                            <tbody>{g.itens.map((it,j)=>(
                              <tr key={j} style={{borderBottom:"1px solid #0a2a0a"}}>
                                <td style={{padding:"4px 8px",color:"#fbbf24",fontWeight:700,whiteSpace:"nowrap"}}>{it.cod}</td>
                                <td style={{padding:"4px 8px",color:"#e2e8f0",maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={it.descricao}>{it.descricao}</td>
                                <td style={{padding:"4px 8px",color:"#cc0000",textAlign:"center"}}>{it.qtdSugerida||"—"}</td>
                                <td style={{padding:"4px 8px",color:parseInt(it.saldoEstoque||"1")<=0?"#f87171":"#34d399",textAlign:"center",fontWeight:700}}>{it.saldoEstoque||"—"}</td>
                              </tr>
                            ))}</tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
              <div style={{padding:"14px 20px",overflowY:"auto",flex:1}}>
                <div style={{color:"#94a3b8",fontWeight:700,fontSize:12,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>📋 Histórico Completo</div>
                {todos.length===0?(
                  <p style={{color:"#334155",fontSize:13,textAlign:"center",padding:"20px 0"}}>Nenhum pedido encontrado para {marca}</p>
                ):todos.map((g,i)=>(
                  <div key={i} style={{borderBottom:"1px solid #1a1a1a",padding:"10px 0",display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start"}}>
                    <div style={{minWidth:85}}>
                      <div style={{color:"#fbbf24",fontWeight:700,fontSize:12}}>{g.dataPedido}</div>
                      <div style={{color:"#475569",fontSize:10,marginTop:2}}>{g.fornecedor}</div>
                    </div>
                    <div style={{flex:1,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                      {g.numCotacao&&<span style={{background:"#1a1a2a",border:"1px solid #4f46e5",borderRadius:5,padding:"2px 8px",color:"#a5b4fc",fontSize:11}}>📋 {g.numCotacao}</span>}
                      {g.numeroPedido&&<span style={{color:"#94a3b8",fontSize:11}}>Ped: {g.numeroPedido}</span>}
                      {g.nf&&<span style={{color:"#67e8f9",fontSize:11}}>NF: {g.nf}</span>}
                      {g.chegouDia&&<span style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:5,padding:"2px 7px",color:"#4ade80",fontSize:10}}>✓ Chegou {g.chegouDia}</span>}
                      {g.valor&&<span style={{color:"#34d399",fontSize:11,fontWeight:600}}>{g.valor}</span>}
                    </div>
                    {g.itens&&g.itens.length>0&&(
                      <div style={{width:"100%",marginTop:4,paddingLeft:97}}>
                        {g.itens.slice(0,3).map((it,j)=>(
                          <div key={j} style={{fontSize:10,color:"#64748b",marginBottom:2}}>
                            <span style={{color:"#fbbf24",fontWeight:600}}>{it.cod}</span> — {it.descricao.substring(0,60)}{it.descricao.length>60?"...":""}
                            {it.qtdSugerida&&<span style={{color:"#cc0000",marginLeft:8}}>qtd:{it.qtdSugerida}</span>}
                          </div>
                        ))}
                        {g.itens.length>3&&<div style={{fontSize:10,color:"#334155"}}>+{g.itens.length-3} itens</div>}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      })()}

      <div style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:10,overflow:"hidden"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid #2a2a2a"}}>
          <span style={{fontWeight:700,color:"#94a3b8",fontSize:13}}>📋 Calendário de Compras Semanal</span>
          <button onClick={()=>setEditando(!editando)} style={{background:editando?"#cc0000":"transparent",color:editando?"#fff":"#555",border:"1px solid #2a2a2a",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>
            {editando?"✓ Salvo":"✏️ Editar"}
          </button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:0}}>
          {DIAS_ORDER.filter(d=>d!=="sab"&&d!=="dom").map((dia)=>{
            const isHoje=dia===diaAtual;
            const cor=corDia(dia);
            const marcas=cal[dia]||[];
            return(
              <div key={dia} style={{borderRight:"1px solid #1a1a1a",padding:"10px 12px",background:isHoje?"#1a0a0a":"transparent",borderBottom:isHoje?`2px solid ${cor}`:"2px solid transparent"}}>
                <div style={{fontWeight:700,color:isHoje?cor:"#475569",fontSize:12,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>{DIAS_LABEL[dia]}</div>
                {marcas.map((m,i)=>{
                  const peds=pedidosSemana(m);
                  return(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:4,marginBottom:4}}>
                      <span onClick={()=>!editando&&setMarcaDetalhe({marca:m,dia})} style={{fontSize:11,color:peds.length>0?"#4ade80":isHoje?"#fff":"#64748b",fontWeight:peds.length>0||isHoje?600:400,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:editando?"default":"pointer",textDecoration:editando?"none":"underline",textUnderlineOffset:2}} title={editando?m:"Clique para ver pedidos de "+m}>
                        {peds.length>0?"✓ ":""}{m}
                      </span>
                      {editando&&<button onClick={()=>removeMarca(dia,i)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,padding:"0 2px",flexShrink:0,color:"#cc0000"}}>✕</button>}
                    </div>
                  );
                })}
                {editando&&(
                  <div style={{marginTop:6,display:"flex",gap:4}}>
                    {editDia===dia?(
                      <>
                        <input autoFocus value={novaMarca} onChange={e=>setNovaMarca(e.target.value)}
                          onKeyDown={e=>{if(e.key==="Enter")addMarca(dia);if(e.key==="Escape")setEditDia(null);}}
                          placeholder="Marca..." style={{background:"#0a0a0a",border:`1px solid ${cor}`,borderRadius:4,padding:"3px 6px",color:"#e2e8f0",fontSize:11,width:"100%"}}/>
                        <button onClick={()=>addMarca(dia)} style={{background:cor,color:"#fff",border:"none",borderRadius:4,padding:"3px 6px",cursor:"pointer",fontSize:11,flexShrink:0}}>+</button>
                      </>
                    ):(
                      <button onClick={()=>{setEditDia(dia);setNovaMarca("");}} style={{background:"transparent",border:`1px dashed #2a2a2a`,borderRadius:4,padding:"3px 8px",color:"#334155",cursor:"pointer",fontSize:10,width:"100%"}}>+ adicionar</button>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── PEDIDOS TAB ───────────────────────────────────────────────────────────────
// ── MODIFICAÇÃO: recebe navegarParaNF como prop
function PedidosTab({sheetsUrl, nfs, fretes, navegarParaNF, highlightPedido, onHighlightPedidoDone}) {
  const [grupos, setGrupos] = useState([]);
  const loadedRef = useRef(false);
  const [syncPed, setSyncPed] = useState("idle");
  const [solicitacoes, setSolicitacoes] = useState([]);
  const solLoaded = useRef(false);
  const [sub, setSub] = useState("abertos");
  const [search, setSearch] = useState("");
  const [expandidos, setExpandidos] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalForn, setModalForn] = useState("");
  const [modalData, setModalData] = useState(today());
  const [modalLink, setModalLink] = useState("");
  const [modalNum, setModalNum] = useState("");
  const [modalTexto, setModalTexto] = useState("");
  const [modalPreview, setModalPreview] = useState([]);
  const [novaSol, setNovaSol] = useState({cod:"", descricao:"", data:""});
  const [toast, setToast] = useState(null);
  const showToast = (m) => { setToast(m); setTimeout(()=>setToast(null),3500); };
  const pedidoRefs=useRef({});

  // Helper: compara NF ignorando série (ex: "262691/1" bate com "262691")
  const nfMatch=(nfA,nfB)=>{
    if(!nfA||!nfB)return false;
    const a=nfA.split("/")[0].trim();
    const b=nfB.split("/")[0].trim();
    return a===b;
  };

  // Highlight: Passo 1 — quando highlightPedido chega, muda sub e busca
  useEffect(()=>{
    if(!highlightPedido)return;
    const g=grupos.find(x=>x.nf&&nfMatch(x.nf,highlightPedido));
    if(g){
      setSub(g.chegouDia?"finalizados":"abertos");
      setSearch(highlightPedido);
    } else {
      setSearch(highlightPedido);
    }
  },[highlightPedido,grupos]);

  // Highlight: Passo 2 — depois que search sincronizou, scrolla e pisca o card
  useEffect(()=>{
    if(!highlightPedido)return;
    if(search!==highlightPedido)return;
    let r1,r2;
    r1=requestAnimationFrame(()=>{
      r2=requestAnimationFrame(()=>{
        const g=grupos.find(x=>x.nf&&nfMatch(x.nf,highlightPedido));
        if(g){
          const el=pedidoRefs.current[g._gid];
          if(el){
            el.scrollIntoView({behavior:"smooth",block:"center"});
            el.classList.remove("nf-highlight");
            void el.offsetWidth;
            el.classList.add("nf-highlight");
          }
          setExpandidos(prev=>({...prev,[g._gid]:true}));
        }
      });
    });
    return()=>{cancelAnimationFrame(r1);if(r2)cancelAnimationFrame(r2);};
  },[search,highlightPedido]);

  const catalogo = React.useMemo(()=>{
    const m={};
    PLANILHA_DATA.pedidos.forEach(p=>{if(p.cod&&p.descricao)m[String(p.cod)]=p.descricao;});
    return m;
  },[]);

  useEffect(()=>{
    loadedRef.current=false;
    async function init(){
      if(sheetsUrl){
        setSyncPed("syncing");
        const cloud=await cloudLoad(STORAGE_PED_V2);
        if(cloud&&cloud.length>0){loadedRef.current=true;setGrupos(cloud);setSyncPed("ok");setTimeout(()=>setSyncPed("idle"),2500);return;}
      }
      try{const s=localStorage.getItem(STORAGE_PED_V2);if(s){const d=JSON.parse(s);if(d&&d.length>0){loadedRef.current=true;setGrupos(d);return;}}}catch{}
      loadedRef.current=true;setGrupos([]);setSyncPed("idle");
    }
    async function initSol(){
      if(sheetsUrl){const c=await cloudLoad(STORAGE_SOL_V2);if(c){solLoaded.current=true;setSolicitacoes(c);return;}}
      try{const s=localStorage.getItem(STORAGE_SOL_V2);if(s){solLoaded.current=true;setSolicitacoes(JSON.parse(s));return;}}catch{}
      solLoaded.current=true;setSolicitacoes(PLANILHA_DATA.solicitacoes||[]);
    }
    init();initSol();
  },[sheetsUrl]);

  useEffect(()=>{
    if(!loadedRef.current)return;
    try{localStorage.setItem(STORAGE_PED_V2,JSON.stringify(grupos));}catch{}
    if(sheetsUrl)cloudSave(STORAGE_PED_V2,grupos);
  },[grupos]);

  useEffect(()=>{
    if(!solLoaded.current)return;
    try{localStorage.setItem(STORAGE_SOL_V2,JSON.stringify(solicitacoes));}catch{}
    if(sheetsUrl)cloudSave(STORAGE_SOL_V2,solicitacoes);
  },[solicitacoes]);

  function parsarItens(raw){
    raw=raw.replace(/__ABRIR PDF__/gi,'').replace(/[🟢🔴🟠🟡⚫⚪🔵🟣✅❌⚠️]/g,'').trim();
    const items=[];
    for(const line of raw.split('\n').map(l=>l.trim()).filter(Boolean)){
      const cols=line.split('\t');
      if(cols.length>=2){const cod=cols[0]?.trim()||'',desc=cols[1]?.trim()||'',qtd=cols[2]?.trim()||'',sal=cols[3]?.trim()||'';if(cod&&desc)items.push({cod,descricao:desc,qtdSugerida:qtd,saldoEstoque:sal});continue;}
      const m=line.match(/^(\d{3,6})\s+(.+)/);
      if(m)items.push({cod:m[1],descricao:m[2].trim(),qtdSugerida:'',saldoEstoque:''});
    }
    return items;
  }

  const criarGrupo=()=>{
    if(!modalForn.trim()){showToast("⚠️ Informe o fornecedor!");return;}
    const novo={
      _gid:Date.now()+Math.random(),
      fornecedor:modalForn.trim(),
      dataPedido:modalData,
      numCotacao:modalNum.trim(),
      linkCotacao:modalLink.trim(),
      numeroPedido:"",
      dataAprovacao:"",
      faturouDia:"",
      nf:"",
      chegouDia:"",
      valor:"",
      itens:modalPreview
    };
    setGrupos(prev=>[novo,...prev]);
    setShowModal(false);setModalForn("");setModalData(today());setModalLink("");setModalNum("");setModalTexto("");setModalPreview([]);
    showToast(`✅ Pedido ${novo.fornecedor} criado!`);
  };

  const updG=(gid,field,value)=>setGrupos(prev=>prev.map(g=>g._gid===gid?{...g,[field]:value}:g));

  const getStatus=(g)=>{
    if(g.chegouDia)return{label:"✅ Recebido",color:"#4ade80",bg:"#052e16",border:"#16a34a"};
    const nfVinc=nfs&&g.nf?nfs.find(n=>n.numero.trim()===g.nf.trim()):null;
    const frVinc=fretes&&g.nf?fretes.find(f=>f.nfAssociada&&f.nfAssociada.trim()===g.nf.trim()):null;
    if(frVinc)return{label:"🚚 Frete em trânsito",color:"#a78bfa",bg:"#1a0a2a",border:"#7c3aed"};
    if(nfVinc)return{label:"📄 NF-e vinculada",color:"#67e8f9",bg:"#0c2a3a",border:"#0891b2"};
    if(g.nf)return{label:"📄 NF lançada",color:"#67e8f9",bg:"#0c2a3a",border:"#0891b2"};
    if(g.faturouDia)return{label:"🔄 Faturando",color:"#fbbf24",bg:"#1c1200",border:"#ca8a04"};
    if(g.numeroPedido)return{label:"📦 Pedido feito",color:"#a5b4fc",bg:"#1e1b4b",border:"#4f46e5"};
    if(g.dataAprovacao)return{label:"✔️ Aprovado",color:"#fb923c",bg:"#1c0a00",border:"#ea580c"};
    if(g.linkCotacao||g.numCotacao)return{label:"📋 Em cotação",color:"#94a3b8",bg:"#1a1a1a",border:"#334155"};
    return{label:"⏳ Novo",color:"#555",bg:"#111",border:"#222"};
  };

  const tCot=(g)=>{if(!g.dataPedido)return null;if(g.dataAprovacao)return diffDays(g.dataPedido,g.dataAprovacao);return diasAberto(g.dataPedido);};
  const tFat=(g)=>{if(!g.dataAprovacao)return null;if(g.faturouDia)return diffDays(g.dataAprovacao,g.faturouDia);return diasAberto(g.dataAprovacao);};
  const tEnt=(g)=>{if(!g.faturouDia)return null;if(g.chegouDia)return diffDays(g.faturouDia,g.chegouDia);return diasAberto(g.faturouDia);};

  const abertos=grupos.filter(g=>!g.chegouDia);
  const finalizados=grupos.filter(g=>!!g.chegouDia);
  const filtrados=(sub==="abertos"?abertos:finalizados).filter(g=>{
    if(!search)return true;
    const s=search.toLowerCase();
    const nfBase=(g.nf||"").split("/")[0].trim();
    const searchBase=search.split("/")[0].trim();
    return(
      g.fornecedor?.toLowerCase().includes(s)||
      (g.numeroPedido||"").includes(s)||
      (g.nf||"").includes(s)||
      nfBase===searchBase||
      (g.numCotacao||"").includes(s)
    );
  });

  const addSol=()=>{
    if(!novaSol.cod.trim())return;
    const desc=novaSol.descricao||catalogo[novaSol.cod.trim()]||"⚠️ CÓDIGO NÃO CADASTRADO";
    setSolicitacoes(prev=>[{...novaSol,descricao:desc,resposta:"",dataResposta:""},...prev]);
    setNovaSol({cod:"",descricao:"",data:""});
  };
  const updSol=(i,f,v)=>setSolicitacoes(prev=>prev.map((s,idx)=>idx===i?{...s,[f]:v}:s));

  const iSt={background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 7px",color:"#e2e8f0",fontSize:12};

  // ── MODIFICAÇÃO: CotacaoBadge sem mudanças

    if(editNum){

        <div style={{display:"flex",gap:4,alignItems:"center"}}>

    if(editLink){

        <div style={{display:"flex",gap:4,alignItems:"center"}}>

            onKeyDown={e=>{if(e.key==="Enter"){updG(g._gid,"linkCotacao",draftLink);setEditLink(false);}if(e.key==="Escape")setEditLink(false);}}

    return(
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <button onClick={()=>{setDraftNum(g.numCotacao||"");setEditNum(true);}}

        {g.linkCotacao

              📄 PDF ↗
            </a>
          :<button onClick={()=>{setDraftLink("");setEditLink(true);}}
              style={{background:"transparent",border:"1px dashed #16a34a",borderRadius:6,padding:"3px 8px",color:"#4ade80",fontSize:11,cursor:"pointer"}}>
              + PDF
            </button>
        }
      </div>
    );
  };

  // ── MODIFICAÇÃO: NfField agora chama navegarParaNF ao clicar no badge da NF
  const NfField=({g})=>{
    const[ed,setEd]=useState(false);
    const[draft,setDraft]=useState(g.nf||"");
    const nfVinc=nfs&&g.nf?nfs.find(n=>n.numero.trim()===g.nf.trim()):null;
    const frVinc=fretes&&g.nf?fretes.find(f=>f.nfAssociada&&f.nfAssociada.trim()===g.nf.trim()):null;

    const salvar=(v)=>{
      updG(g._gid,"nf",v);
      setEd(false);
    };

    if(ed){
      return(
        <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
          placeholder="Nº NF..."
          onBlur={()=>salvar(draft)}
          onKeyDown={e=>{if(e.key==="Enter")salvar(draft);if(e.key==="Escape"){setDraft(g.nf||"");setEd(false);}}}
          style={{background:"#0a0a0a",border:"1px solid #0891b2",borderRadius:5,padding:"3px 8px",color:"#67e8f9",fontSize:12,width:90}}/>
      );
    }

    if(!g.nf){
      return(
        <button onClick={()=>{setDraft("");setEd(true);}}
          style={{background:"transparent",border:"1px dashed #334155",borderRadius:5,padding:"3px 8px",color:"#475569",fontSize:12,cursor:"pointer"}}>
          + NF
        </button>
      );
    }

    // ── MODIFICAÇÃO: ao clicar no número da NF, navega para aba NF-e com destaque
    return(
      <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
        <button
          onClick={()=>navegarParaNF(g.nf.trim())}

          style={{
            background:nfVinc?"#0c2a3a":"#141414",
            border:`1px solid ${nfVinc?"#0891b2":"#334155"}`,
            borderRadius:6,
            padding:"3px 10px",
            color:nfVinc?"#67e8f9":"#94a3b8",
            fontSize:12,
            fontWeight:700,
            cursor:"pointer",
            whiteSpace:"nowrap",
            display:"flex",
            alignItems:"center",
            gap:5,
          }}
        >
          {nfVinc?"📄":"🔢"} {g.nf}

          <span style={{fontSize:9,color:"#475569",borderLeft:"1px solid #2a2a2a",paddingLeft:5}}>↗</span>
        </button>
        {/* Botão separado para editar o número */}
        <button onClick={()=>{setDraft(g.nf);setEd(true);}}
          style={{background:"transparent",border:"1px solid #1a2a3a",borderRadius:5,padding:"2px 6px",color:"#334155",fontSize:10,cursor:"pointer"}}

        {frVinc&&
          <span style={{background:"#1a0a2a",border:"1px solid #7c3aed",borderRadius:6,padding:"3px 8px",color:"#a78bfa",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>

      </div>

  return(
    <div>
      {toast&&<div style={{position:"fixed",top:20,right:20,background:"#065f46",color:"#fff",padding:"12px 20px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:998,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}
      {syncPed!=="idle"&&<div style={{display:"flex",alignItems:"center",gap:8,background:syncPed==="syncing"?"#1c1200":"#052e16",border:`1px solid ${syncPed==="syncing"?"#ca8a04":"#16a34a"}`,borderRadius:8,padding:"8px 16px",marginBottom:14,fontSize:12,color:syncPed==="syncing"?"#fbbf24":"#4ade80",fontWeight:600}}><span style={{width:8,height:8,borderRadius:"50%",background:syncPed==="syncing"?"#fbbf24":"#4ade80",display:"inline-block"}}/>{syncPed==="syncing"?"☁️ Carregando pedidos...":"☁️ Sincronizado ✓"}</div>}

      <CalendarioCompras grupos={grupos} sheetsUrl={sheetsUrl}/>

      <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        {[["📦","Em Aberto","#fbbf24",abertos.length],["✅","Recebidos","#34d399",finalizados.length],["📋","Total","#fff",grupos.length],["⚠️","Aguard.NF","#f87171",abertos.filter(g=>g.numeroPedido&&!g.nf).length]].map(([ic,lb,cl,ct])=>(
          <div key={lb} style={{background:"#141414",borderRadius:8,padding:"10px 18px",display:"flex",alignItems:"center",gap:8,border:"1px solid #2a2a2a"}}>

          </div>

      </div>

      <div style={{display:"flex",gap:2,borderBottom:"1px solid #2a2a2a",marginBottom:14}}>
        {[["abertos","⏳ Em Aberto",abertos.length,"#fbbf24"],["finalizados","✅ Recebidos",finalizados.length,"#34d399"],["solicitacoes","📋 Solicitações",solicitacoes.length,"#a78bfa"]].map(([id,lb,ct,cor])=>(

            {lb} <span style={{background:cor,color:"#000",borderRadius:10,padding:"1px 7px",fontSize:11,marginLeft:4,fontWeight:700}}>{ct}</span>
          </button>

      </div>

      {sub!=="solicitacoes"&&(

              </div>
              <div>
                <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>DATA DO PEDIDO</label>

              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:12,marginBottom:12}}>
              <div>

              <div>

                  style={{width:"100%",background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"9px 12px",color:"#4ade80",fontSize:12,boxSizing:"border-box"}}/>
              </div>
            </div>
            {modalLink&&(
              <div style={{marginBottom:12}}>
                <a href={modalLink} target="_blank" rel="noreferrer" style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:7,padding:"6px 14px",color:"#4ade80",fontSize:12,textDecoration:"none"}}>
                  📄 Testar link ↗
                </a>
              </div>
            )}
            <div style={{marginBottom:12}}>
              <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>ITENS — cole do sistema (opcional)</label>
              <textarea value={modalTexto} onChange={e=>{setModalTexto(e.target.value);setModalPreview(e.target.value.trim()?parsarItens(e.target.value):[]);}}
                rows={5} placeholder={"Código  Descrição  Qtd  Saldo"}
                style={{width:"100%",background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"10px 12px",color:"#e2e8f0",fontSize:12,boxSizing:"border-box",resize:"vertical",fontFamily:"monospace"}}/>
            </div>
            {modalPreview.length>0&&(
              <div style={{background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 14px",marginBottom:14,maxHeight:160,overflowY:"auto"}}>
                <div style={{color:"#4ade80",fontSize:12,fontWeight:700,marginBottom:8}}>✅ {modalPreview.length} item(ns) detectado(s)</div>
                {modalPreview.map((it,i)=>(
                  <div key={i} style={{display:"flex",gap:10,fontSize:11,color:"#94a3b8",marginBottom:3}}>
                    <span style={{color:"#fbbf24",fontWeight:700,minWidth:40}}>{it.cod}</span>
                    <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.descricao}</span>
                    {it.qtdSugerida&&<span style={{color:"#cc0000"}}>qtd:{it.qtdSugerida}</span>}
                    {it.saldoEstoque&&<span style={{color:"#34d399"}}>saldo:{it.saldoEstoque}</span>}
                  </div>
                ))}
              </div>
            )}
            <div style={{display:"flex",justifyContent:"flex-end"}}>
              <button onClick={criarGrupo} style={{background:"#cc0000",color:"#fff",border:"none",borderRadius:8,padding:"10px 26px",cursor:"pointer",fontWeight:700,fontSize:14}}>✅ Criar Pedido</button>
            </div>
          </div>
        </div>
      )}

      {sub!=="solicitacoes"&&(
        filtrados.length===0?(
          <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
            <div style={{fontSize:44}}>📦</div>
            <p style={{marginTop:10,fontSize:14}}>{sub==="abertos"?"Nenhum pedido em aberto.":"Nenhum pedido finalizado ainda."}</p>
            {sub==="abertos"&&<button onClick={()=>setShowModal(true)} style={{marginTop:14,background:"#cc0000",color:"#fff",border:"none",borderRadius:8,padding:"9px 22px",cursor:"pointer",fontWeight:700,fontSize:13}}>➕ Criar primeiro pedido</button>}
          </div>
        ):(
          <div>
            {filtrados.map((g)=>{
              const st=getStatus(g);
              const tc=tCot(g),tf=tFat(g),te=tEnt(g);
              const exp=expandidos[g._gid];
              return(
                <div key={g._gid} ref={el=>{if(el)pedidoRefs.current[g._gid]=el;}} style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:10,marginBottom:10,overflow:"hidden"}}>
                  <div style={{padding:"11px 14px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <button onClick={()=>setExpandidos(p=>({...p,[g._gid]:!p[g._gid]}))}
                      style={{background:"transparent",border:"none",color:"#555",cursor:"pointer",fontSize:14,padding:"0 4px",flexShrink:0}}>{exp?"▼":"▶"}</button>
                    <div style={{display:"flex",flexDirection:"column",minWidth:110,flexShrink:0}}>
                      <span style={{fontWeight:700,color:"#cc0000",fontSize:14}}>{g.fornecedor}</span>
                      <span style={{color:"#475569",fontSize:11}}>{g.dataPedido}</span>
                    </div>
                    <CotacaoBadge g={g}/>
                    <span style={{color:"#2a2a2a",fontSize:18,flexShrink:0}}>→</span>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                      <span style={{fontSize:9,color:"#475569",textTransform:"uppercase"}}>Nº Pedido</span>
                      <input value={g.numeroPedido||""} onChange={e=>updG(g._gid,"numeroPedido",e.target.value)}
                        placeholder="pedido..." style={{...iSt,width:90,color:"#a5b4fc"}}/>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                      <span style={{fontSize:9,color:"#475569",textTransform:"uppercase"}}>Aprovação</span>
                      <ChegouInput value={g.dataAprovacao} onSave={v=>updG(g._gid,"dataAprovacao",v)}/>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                      <span style={{fontSize:9,color:"#475569",textTransform:"uppercase"}}>Faturou</span>
                      <ChegouInput value={g.faturouDia} onSave={v=>updG(g._gid,"faturouDia",v)}/>
                    </div>
                    <span style={{color:"#2a2a2a",fontSize:18,flexShrink:0}}>→</span>
                    {/* ── MODIFICAÇÃO: NfField com navegarParaNF ── */}
                    <div style={{display:"flex",flexDirection:"column",gap:2}}>
                      <span style={{fontSize:9,color:"#475569",textTransform:"uppercase"}}>NF-e</span>
                      <NfField g={g}/>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                      <span style={{fontSize:9,color:"#475569",textTransform:"uppercase"}}>Chegou</span>
                      <ChegouInput value={g.chegouDia} onSave={v=>updG(g._gid,"chegouDia",v)}/>
                    </div>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginLeft:"auto"}}>
                      {tc!==null&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><span style={{fontSize:9,color:"#475569"}}>⏱Cotação</span><DiasBadge dias={tc}/></div>}
                      {tf!==null&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><span style={{fontSize:9,color:"#475569"}}>⏱Faturar</span><DiasBadge dias={tf}/></div>}
                      {te!==null&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><span style={{fontSize:9,color:"#475569"}}>⏱Entrega</span>{g.chegouDia?<span style={{background:"#0f2922",border:"1px solid #10b981",borderRadius:6,padding:"3px 9px",color:"#34d399",fontWeight:700,fontSize:12}}>{te}d ✓</span>:<DiasBadge dias={te}/>}</div>}
                    </div>
                    <span style={{background:st.bg,border:`1px solid ${st.border}`,borderRadius:6,padding:"4px 10px",color:st.color,fontWeight:700,fontSize:11,whiteSpace:"nowrap",flexShrink:0}}>{st.label}</span>
                    <button onClick={()=>{if(confirm(`Remover pedido ${g.fornecedor}?`))setGrupos(prev=>prev.filter(x=>x._gid!==g._gid));}}
                      style={{background:"transparent",border:"1px solid #3a1a1a",borderRadius:6,color:"#cc0000",padding:"4px 8px",cursor:"pointer",fontSize:11,flexShrink:0}}>🗑️</button>
                  </div>

                  {exp&&(
                    <div style={{borderTop:"1px solid #1a1a1a",padding:"14px 16px",background:"#0d0d0d"}}>
                      <div style={{display:"flex",gap:12,marginBottom:14,flexWrap:"wrap",alignItems:"flex-end"}}>
                        <div style={{flex:1,minWidth:200}}>
                          <label style={{fontSize:10,color:"#475569",display:"block",marginBottom:3}}>🔗 Link PDF Cotação (Google Drive)</label>
                          <input value={g.linkCotacao||""} onChange={e=>updG(g._gid,"linkCotacao",e.target.value)}
                            placeholder="https://drive.google.com/file/d/..."
                            style={{width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"6px 10px",color:"#4ade80",fontSize:12,boxSizing:"border-box"}}/>

                          <label style={{fontSize:10,color:"#475569",display:"block",marginBottom:3}}>Nº Cotação</label>
                          <input value={g.numCotacao||""} onChange={e=>updG(g._gid,"numCotacao",e.target.value)}

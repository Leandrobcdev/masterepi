async function cloudSave(key, value){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return false;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),10000);
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({key,value}),signal:ctrl.signal});
    clearTimeout(tid);
    return true;
  }catch{return false;}
}
async function cloudLoad(key){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return null;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch(`${url}?key=${encodeURIComponent(key)}&ts=${Date.now()}`,{signal:ctrl.signal});
    clearTimeout(tid);
    const text=await r.text();
    if(!text||text==="null"||text.trim()==="")return null;
    return JSON.parse(text);
  }catch{return null;}
}

function today(){return new Date().toLocaleDateString("pt-BR");}
function parseDate(str){if(!str)return 0;const[d,m,y]=str.split("/");return new Date(`${y}-${m}-${d}`).getTime()||0;}
function diffDays(a,b){const da=parseDate(a),db=parseDate(b);if(!da||!db)return null;return Math.round((db-da)/86400000);}
function diasAberto(emissao){if(!emissao)return null;const h=new Date();h.setHours(0,0,0,0);const e=parseDate(emissao);return e?Math.floor((h-e)/86400000):null;}
function supplierKey(e){return e?(e.replace(/\(CNPJ:.*?\)/gi,"").trim().toUpperCase().substring(0,40)):"";}
function buildStats(nfs){
  const map={};
  for(const n of nfs){if(!n.emissao||!n.chegou)continue;const d=diffDays(n.emissao,n.chegou);if(d===null||d<0)continue;const k=supplierKey(n.emitente);if(!map[k])map[k]=[];map[k].push(d);}
  const s={};
  for(const[k,a]of Object.entries(map))s[k]={media:Math.round(a.reduce((x,y)=>x+y,0)/a.length),count:a.length};
  return s;
}
function fmtVal(v){if(!v)return"";const n=parseFloat(String(v).replace(/[^0-9,.-]/g,"").replace(",","."));return isNaN(n)?v:"R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}

// ── XML Parser ──────────────────────────────────────────────────────────────
function parseXML(xmlText){
  try{
    const parser=new DOMParser();
    const doc=parser.parseFromString(xmlText,"text/xml");
    const ns="http://www.portalfiscal.inf.br/nfe";
    const g=(tag,ctx)=>(ctx||doc).getElementsByTagNameNS(ns,tag)[0]?.textContent||"";
    const nNF=g("nNF"); const serie=g("serie");
    const numero=serie?`${nNF}/${serie}`:nNF;
    const emitNode=doc.getElementsByTagNameNS(ns,"emit")[0];
    const destNode=doc.getElementsByTagNameNS(ns,"dest")[0];
    const transpNode=doc.getElementsByTagNameNS(ns,"transporta")[0];
    const emitente=g("xNome",emitNode)||"";
    const emitCNPJ=emitNode?.getElementsByTagNameNS(ns,"CNPJ")[0]?.textContent||"";
    const emitEnder=emitNode?.getElementsByTagNameNS(ns,"enderEmit")[0];
    const emitCidade=g("xMun",emitEnder)+(g("UF",emitEnder)?" / "+g("UF",emitEnder):"");
    const destNome=g("xNome",destNode)||"";
    const destEnder=destNode?.getElementsByTagNameNS(ns,"enderDest")[0];
    const destCidade=g("xMun",destEnder)+(g("UF",destEnder)?" / "+g("UF",destEnder):"");
    const vNF=g("vNF"); const valor=vNF?fmtVal(vNF):"";
    const chNFe=g("chNFe");
    const dhEmi=g("dhEmi");
    const emissao=dhEmi?(()=>{const d=new Date(dhEmi);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;})():"";
    const natureza=g("natOp")||"";
    const transportadora=g("xNome",transpNode)||"";
    const transCNPJ=transpNode?.getElementsByTagNameNS(ns,"CNPJ")[0]?.textContent||"";
    const modFrete=(()=>{const m=g("modFrete");return{0:"0-Emitente",1:"1-Dest/Rem",2:"2-Terceiros",3:"3-Próprio",4:"4-Próprio(Dest)",9:"9-Sem frete"}[m]||m;})();
    // Volumes
    const volNode=doc.getElementsByTagNameNS(ns,"vol")[0];
    const qVol=g("qVol",volNode)||""; const pesoB=g("pesoB",volNode)||""; const pesoL=g("pesoL",volNode)||"";
    const nVol=g("nVol",volNode)||"";
    // Dup/vencimento
    const dups=[...doc.getElementsByTagNameNS(ns,"dup")].map(d=>({nDup:g("nDup",d),dVenc:g("dVenc",d),vDup:fmtVal(g("vDup",d))}));
    // Produtos
    const itens=[...doc.getElementsByTagNameNS(ns,"det")].map(det=>{
      const prod=det.getElementsByTagNameNS(ns,"prod")[0];
      return{
        item:det.getAttribute("nItem")||"",
        codigo:g("cProd",prod),
        descricao:g("xProd",prod),
        ncm:g("NCM",prod),
        cfop:g("CFOP",prod),
        unid:g("uCom",prod),
        qtd:g("qCom",prod),
        vUnit:fmtVal(g("vUnCom",prod)),
        vProd:fmtVal(g("vProd",prod)),
        pedido:g("xPed",prod)||"",
      };
    });
    // Totais
    const tot=doc.getElementsByTagNameNS(ns,"ICMSTot")[0];
    const totais={vProd:fmtVal(g("vProd",tot)),vFrete:fmtVal(g("vFrete",tot)),vDesc:fmtVal(g("vDesc",tot)),vIPI:fmtVal(g("vIPI",tot)),vPIS:fmtVal(g("vPIS",tot)),vCOFINS:fmtVal(g("vCOFINS",tot)),vNF:fmtVal(g("vNF",tot))};
    const infCpl=g("infCpl")||"";
    return{numero,emissao,emitente,emitCNPJ,emitCidade,destNome,destCidade,valor,chNFe,natureza,transportadora,transCNPJ,modFrete,qVol,pesoB,pesoL,nVol,dups,itens,totais,infCpl,xmlOk:true};
  }catch(e){return null;}
}

// ── Parsers ──────────────────────────────────────────────────────────────────
function parseNFs(text){
  const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);const r=[];
  for(const line of lines){
    if(/^(número|emissão|emitente)/i.test(line))continue;
    const p=line.split(/\t/);
    if(p.length>=5){r.push({numero:p[0]?.trim()||"",emissao:p[1]?.trim()||"",emitente:p[2]?.trim()||"",natureza:p[3]?.trim()||"",valor:p[4]?.trim()||"",pedido:"",obs:"",chegou:""});continue;}
    const dm=line.match(/(\d{2}\/\d{2}\/\d{4})/);const vm=line.match(/(R\$\s*[\d.,]+)/i);if(!dm)continue;
    const di=line.indexOf(dm[0]);const num=line.substring(0,di).trim();const after=line.substring(di+dm[0].length).trim();
    const cm=after.match(/^(.*?\(CNPJ:\s*[\d.\/-]+\))/i);
    let emit="",valor=vm?vm[0]:"";
    if(cm){emit=cm[1].trim();}else if(vm){const vi=after.indexOf(vm[0]);emit=after.substring(0,vi).trim();}
    if(num)r.push({numero:num,emissao:dm[0],emitente:emit,natureza:"",valor,pedido:"",obs:"",chegou:""});
  }
  return r;
}
function parseFretes(text){
  const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);const r=[];
  for(const line of lines){
    if(/^(número|emissão|emitente)/i.test(line))continue;
    const p=line.split(/\t/);
    if(p.length>=5){r.push({nf:p[0]?.trim()||"",emissao:p[1]?.trim()||"",transportadora:p[2]?.trim()||"",valor:p[4]?.trim()||"",pedido:"",rastreio:"",obs:"",chegou:"",origem:"",destino:"",previsao:"",nfAssociada:""});continue;}
    const dm=line.match(/(\d{2}\/\d{2}\/\d{4})/);const vm=line.match(/(R\$\s*[\d.,]+)/i);if(!dm)continue;
    const di=line.indexOf(dm[0]);const nf=line.substring(0,di).trim();const after=line.substring(di+dm[0].length).trim();
    let trans="",valor=vm?vm[0]:"";
    if(vm){const vi=after.indexOf(vm[0]);trans=after.substring(0,vi).trim();}
    if(nf||trans)r.push({nf,emissao:dm[0],transportadora:trans,valor,pedido:"",rastreio:"",obs:"",chegou:"",origem:"",destino:"",previsao:"",nfAssociada:""});
  }
  return r;
}

function LinkBadge({value,placeholder,color,bg,borderColor,icon,onChange,onClear}){

}

// ── NF TAB ───────────────────────────────────────────────────────────────────
function NfTab({nfs,setNfs,fretes,setFretes}){
  const[sub,setSub]=useState("pendentes");
  const[showPaste,setShowPaste]=useState(false);
  const[showForm,setShowForm]=useState(false);
  const[pasteText,setPasteText]=useState("");
  const[pastePreview,setPastePreview]=useState([]);
  const[search,setSearch]=useState("");
  const[sort,setSort]=useState("newest");
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({numero:"",emissao:"",emitente:"",natureza:"",valor:"",pedido:"",obs:"",chegou:""});
  const[toast,setToast]=useState(null);
  const[danfeNf,setDanfeNf]=useState(null);
  const xmlRef=useRef();
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500);};
  const inp={width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"8px 10px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};

  const handleChegou=(nfId,chegou)=>{
    setNfs(prev=>prev.map(n=>n.id===nfId?{...n,chegou}:n));
    const nf=nfs.find(n=>n.id===nfId);
    if(nf)setFretes(prev=>prev.map(fr=>fr.nfAssociada===nf.numero?{...fr,chegou}:fr));
  };

  // XML import — multiple files at once
  const handleXMLFiles=(files)=>{
    let ok=0,notFound=0;
    const promises=[...files].map(file=>new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const xmlData=parseXML(e.target.result);
        if(!xmlData){resolve();return;}
        setNfs(prev=>{
          const idx=prev.findIndex(n=>n.numero.trim()===xmlData.numero.trim());
          if(idx===-1){notFound++;resolve();return prev;}
          ok++;
          const updated=[...prev];
          updated[idx]={...updated[idx],xmlData,
            emitente:xmlData.emitente||updated[idx].emitente,
            valor:xmlData.valor||updated[idx].valor,
            natureza:xmlData.natureza||updated[idx].natureza,
            pedido:xmlData.itens?.[0]?.pedido||updated[idx].pedido,
          };
          resolve();
          return updated;
        });
      };
      reader.readAsText(file);
    }));
    Promise.all(promises).then(()=>{
      setTimeout(()=>showToast(`✅ ${ok} XML(s) associado(s)${notFound>0?" · "+notFound+" não encontrado(s)":""}`),200);
    });
  };

  const stats=buildStats(nfs);
  const pendentes=nfs.filter(n=>!n.chegou);
  const finalizados=nfs.filter(n=>!!n.chegou);
  const base=sub==="pendentes"?pendentes:finalizados;
  const filtered=base.filter(n=>!search||n.numero.includes(search)||n.emitente.toLowerCase().includes(search.toLowerCase())||(n.pedido||"").includes(search))
    .sort((a,b)=>{const da=parseDate(a.emissao)||parseDate(a.dataCadastro);const db=parseDate(b.emissao)||parseDate(b.dataCadastro);return sort==="oldest"?da-db:db-da;});
  const getLinked=(num)=>fretes.find(f=>f.nfAssociada&&f.nfAssociada.trim()===num.trim());

  const handlePaste=(t)=>{setPasteText(t);setPastePreview(t.trim()?parseNFs(t):[]);};
  const handleImport=()=>{
    const exist=new Set(nfs.map(n=>n.numero.trim()));
    const novas=pastePreview.filter(n=>!exist.has(n.numero.trim()));
    const dups=pastePreview.length-novas.length;
    if(!novas.length){showToast("⚠️ Todas já existem!");return;}
    setNfs(prev=>[...novas.map(n=>({...n,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
    setPasteText("");setPastePreview([]);setShowPaste(false);
    showToast(`✅ ${novas.length} importada(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);
  };
  const handleSave=()=>{
    if(!form.numero||!form.emitente)return alert("Preencha Número e Emitente.");
    if(editId)setNfs(prev=>prev.map(n=>n.id===editId?{...form,id:editId,dataCadastro:n.dataCadastro}:n));
    else setNfs(prev=>[{...form,id:Date.now(),dataCadastro:today()},...prev]);
    setEditId(null);setShowForm(false);setForm({numero:"",emissao:"",emitente:"",natureza:"",valor:"",pedido:"",obs:"",chegou:""});
    showToast("NF salva!");
  };
  const upd=(id,f,v)=>setNfs(prev=>prev.map(n=>n.id===id?{...n,[f]:v}:n));

  return(
    <div>
      {danfeNf&&<DanfeModal nf={danfeNf} onClose={()=>setDanfeNf(null)}/>}
      {toast&&<div style={{position:"fixed",top:20,right:20,background:"#065f46",color:"#fff",padding:"12px 20px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:998,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}
      {/* Counters */}
      <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        {[["⏳","Pendentes","#fbbf24",pendentes.length],["✅","Finalizados","#34d399",finalizados.length],["📋","Total","#fff",nfs.length],["📎","Com XML","#a5b4fc",nfs.filter(n=>n.xmlData).length]].map(([ic,lb,cl,ct])=>(
          <div key={lb} style={{background:"#141414",borderRadius:8,padding:"10px 18px",display:"flex",alignItems:"center",gap:8,border:"1px solid #2a2a2a"}}>
            <span>{ic}</span><span style={{fontSize:13,color:"#94a3b8"}}>{lb}</span><span style={{fontWeight:700,fontSize:20,color:cl}}>{ct}</span>
          </div>
        ))}
      </div>
      {/* Action buttons */}
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <button onClick={()=>{setShowPaste(!showPaste);setShowForm(false);}} style={{background:showPaste?"#990000":"#cc0000",color:"#fff",border:"none",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📋 Colar Lista</button>
        <button onClick={()=>xmlRef.current.click()} style={{background:"#1a0a0a",color:"#ff9999",border:"1px solid #cc0000",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📎 Importar XML(s)</button>
        <input ref={xmlRef} type="file" accept=".xml" multiple style={{display:"none"}} onChange={e=>{handleXMLFiles(e.target.files);e.target.value="";}}/>
        <button onClick={()=>{setShowForm(!showForm);setShowPaste(false);setEditId(null);setForm({numero:"",emissao:"",emitente:"",natureza:"",valor:"",pedido:"",obs:"",chegou:""});}} style={{background:"#141414",color:"#e2e8f0",border:"1px solid #2a2a2a",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>+ Manual</button>
      </div>
      {/* Paste panel */}
      {showPaste&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #cc0000"}}>
          <h3 style={{margin:"0 0 6px",fontSize:15,color:"#ff9999"}}>📋 Colar Lista do Sistema</h3>
          <p style={{margin:"0 0 12px",fontSize:13,color:"#555"}}>Selecione tudo no Linx Microvix, copie (Ctrl+C) e cole abaixo:</p>
          <textarea value={pasteText} onChange={e=>handlePaste(e.target.value)} placeholder="Cole aqui..." rows={4} style={{...inp,resize:"vertical",fontFamily:"monospace",fontSize:12}}/>
          {pastePreview.length>0&&(()=>{
            const exist=new Set(nfs.map(n=>n.numero.trim()));
            const novas=pastePreview.filter(n=>!exist.has(n.numero.trim()));
            const dups=pastePreview.filter(n=>exist.has(n.numero.trim()));
            return <div style={{marginTop:14}}>
              <p style={{margin:"0 0 8px",fontSize:13,color:"#34d399",fontWeight:600}}>✅ {novas.length} nova(s) {dups.length>0&&<span style={{color:"#f87171"}}> · ⚠️ {dups.length} duplicata(s) serão ignoradas</span>}</p>
              <div style={{overflowX:"auto",maxHeight:200,overflowY:"auto",borderRadius:8,border:"1px solid #2a2a2a"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead><tr style={{background:"#0a0a0a"}}>{["","Número","Emissão","Emitente","Valor"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#555",fontWeight:600}}>{h}</th>)}</tr></thead>
                  <tbody>{pastePreview.map((n,i)=>{const isDup=exist.has(n.numero.trim());return <tr key={i} style={{borderBottom:"1px solid #1a1a1a",opacity:isDup?0.4:1}}><td style={{padding:"6px 10px"}}>{isDup?<span style={{color:"#f87171",fontSize:11}}>DUP</span>:<span style={{color:"#34d399",fontSize:11}}>NEW</span>}</td><td style={{padding:"6px 10px",color:"#ff9999",fontWeight:600}}>{n.numero}</td><td style={{padding:"6px 10px",color:"#94a3b8"}}>{n.emissao}</td><td style={{padding:"6px 10px",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.emitente}</td><td style={{padding:"6px 10px",color:"#34d399"}}>{n.valor}</td></tr>;})}</tbody>

            </div>;
          })()}
          {pasteText&&pastePreview.length===0&&<p style={{color:"#f87171",fontSize:13,marginTop:10}}>⚠️ Não foi possível detectar NFs.</p>}
        </div>
      )}
      {/* Manual form */}
      {showForm&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #2a2a2a"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,color:"#ff9999"}}>{editId?"✏️ Editar NF":"📥 Nova NF Manual"}</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
            {[["numero","Número/Série *"],["emissao","Data de Emissão"],["emitente","Emitente *"],["valor","Valor (R$)"],["pedido","Nº Pedido"],["chegou","Data de Chegada"]].map(([k,l])=>(
              <div key={k}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>{l}</label><input value={form[k]||""} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>
            ))}
            <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>Observações</label><input value={form.obs||""} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} style={inp}/></div>

              </tr>
            </thead>
            <tbody>
              {filtered.map((nf,i)=>{
                const linkedFrete=getLinked(nf.numero);
                const key=supplierKey(nf.emitente);
                const st=stats[key];
                const dias=nf.chegou?diffDays(nf.emissao,nf.chegou):diasAberto(nf.emissao);
                const hasXml=!!nf.xmlData;
                return(
                  <tr key={nf.id} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>setDanfeNf(nf)} style={{background:"transparent",border:"none",cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:5}}>
                        <span style={{color:hasXml?"#cc0000":"#666",fontWeight:700,fontSize:13,textDecoration:"underline",textUnderlineOffset:2}}>{nf.numero}</span>
                        {hasXml?<span style={{fontSize:10,background:"#1a0000",color:"#ff6666",border:"1px solid #cc0000",borderRadius:4,padding:"1px 5px"}}>XML</span>:<span style={{fontSize:10,color:"#444",border:"1px dashed #333",borderRadius:4,padding:"1px 5px"}}>sem XML</span>}
                      </button>
                    </td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{nf.emissao}</td>
                    <td style={{padding:"9px 12px",textAlign:"center"}}>
                      {nf.chegou?<span style={{background:"#0f2922",border:"1px solid #10b981",borderRadius:6,padding:"3px 9px",color:"#34d399",fontWeight:700,fontSize:12}}>{dias}d ✓</span>:<DiasBadge dias={dias}/>}
                    </td>
                    <td style={{padding:"9px 12px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={nf.emitente}>{nf.emitente}</td>
                    <td style={{padding:"9px 12px"}}>{st?<MediaBadge media={st.media} count={st.count}/>:<span style={{color:"#333",fontSize:11}}>sem histórico</span>}</td>
                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{nf.valor}</td>
                    <td style={{padding:"9px 12px"}}><input value={nf.pedido||""} onChange={e=>upd(nf.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {linkedFrete?<span style={{background:"#0c2a3a",border:"1px solid #0891b2",borderRadius:6,padding:"3px 9px",color:"#38bdf8",fontWeight:700,fontSize:12}}>🚚 {linkedFrete.nf||linkedFrete.transportadora?.split(" ")[0]}</span>:<span style={{color:"#333",fontSize:12}}>—</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={nf.chegou} onSave={v=>handleChegou(nf.id,v)}/></td>
                    <td style={{padding:"9px 12px"}}><input value={nf.obs||""} onChange={e=>upd(nf.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{setForm({...nf});setEditId(nf.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setNfs(prev=>prev.filter(n=>n.id!==nf.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── FRETES TAB ───────────────────────────────────────────────────────────────
const FR_EMPTY={transportadora:"",nf:"",nfAssociada:"",pedido:"",origem:"",destino:"",previsao:"",valor:"",rastreio:"",obs:"",chegou:""};
function FretesTab({fretes,setFretes,nfs,setNfs}){
  const[sub,setSub]=useState("pendentes");
  const[showForm,setShowForm]=useState(false);
  const[showPaste,setShowPaste]=useState(false);
  const[pasteText,setPasteText]=useState("");
  const[pastePreview,setPastePreview]=useState([]);
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(FR_EMPTY);
  const[search,setSearch]=useState("");
  const[toast,setToast]=useState(null);
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500);};
  const inp={width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"8px 10px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};

  const handleChegou=(frId,chegou)=>{
    setFretes(prev=>prev.map(f=>f.id===frId?{...f,chegou}:f));
    const fr=fretes.find(f=>f.id===frId);
    if(fr&&fr.nfAssociada)setNfs(prev=>prev.map(n=>n.numero===fr.nfAssociada?{...n,chegou}:n));
  };
  const handleNfAssociada=(frId,nfNum)=>{
    setFretes(prev=>prev.map(f=>{
      if(f.id!==frId)return f;
      const matchNf=nfs.find(n=>n.numero===nfNum);
      return{...f,nfAssociada:nfNum,chegou:matchNf?.chegou||f.chegou};
    }));
  };
  const handlePaste=(t)=>{setPasteText(t);setPastePreview(t.trim()?parseFretes(t):[]);};
  const handleImport=()=>{
    const exist=new Set(fretes.map(f=>f.nf.trim()));
    const novos=pastePreview.filter(f=>!exist.has(f.nf.trim()));
    const dups=pastePreview.length-novos.length;
    if(!novos.length){showToast("⚠️ Todos já existem!");return;}
    setFretes(prev=>[...novos.map(f=>({...f,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
    setPasteText("");setPastePreview([]);setShowPaste(false);
    showToast(`✅ ${novos.length} importado(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);
  };
  const handleSave=()=>{
    if(!form.transportadora)return alert("Informe a transportadora.");
    if(editId)setFretes(prev=>prev.map(f=>f.id===editId?{...form,id:editId,dataCadastro:f.dataCadastro}:f));
    else setFretes(prev=>[{...form,id:Date.now(),dataCadastro:today()},...prev]);
    setEditId(null);setShowForm(false);setForm(FR_EMPTY);
    showToast("Frete salvo!");
  };
  const upd=(id,f,v)=>setFretes(prev=>prev.map(fr=>fr.id===id?{...fr,[f]:v}:fr));

  const pendentes=fretes.filter(f=>!f.chegou);
  const finalizados=fretes.filter(f=>!!f.chegou);
  const base=sub==="pendentes"?pendentes:finalizados;
  const filtered=base.filter(f=>!search||f.transportadora.toLowerCase().includes(search.toLowerCase())||(f.nf||"").includes(search)||(f.pedido||"").includes(search)||(f.nfAssociada||"").includes(search));

  return(
    <div>
      {toast&&<div style={{position:"fixed",top:20,right:20,background:"#065f46",color:"#fff",padding:"12px 20px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:998,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}
      <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        {[["⏳","Pendentes","#fbbf24",pendentes.length],["✅","Finalizados","#34d399",finalizados.length],["🚚","Total","#fff",fretes.length]].map(([ic,lb,cl,ct])=>(
          <div key={lb} style={{background:"#141414",borderRadius:8,padding:"10px 18px",display:"flex",alignItems:"center",gap:8,border:"1px solid #2a2a2a"}}>
            <span>{ic}</span><span style={{fontSize:13,color:"#94a3b8"}}>{lb}</span><span style={{fontWeight:700,fontSize:20,color:cl}}>{ct}</span>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={()=>{setShowPaste(!showPaste);setShowForm(false);}} style={{background:showPaste?"#990000":"#cc0000",color:"#fff",border:"none",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📋 Colar Lista</button>
        <button onClick={()=>{setShowForm(!showForm);setShowPaste(false);setEditId(null);setForm(FR_EMPTY);}} style={{background:"#141414",color:"#e2e8f0",border:"1px solid #2a2a2a",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>+ Manual</button>
      </div>
      {showPaste&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #cc0000"}}>
          <h3 style={{margin:"0 0 6px",fontSize:15,color:"#ff9999"}}>📋 Colar Lista de Fretes</h3>
          <p style={{margin:"0 0 12px",fontSize:13,color:"#555"}}>Cole o conteúdo copiado do sistema:</p>
          <textarea value={pasteText} onChange={e=>handlePaste(e.target.value)} placeholder="Cole aqui..." rows={4} style={{...inp,resize:"vertical",fontFamily:"monospace",fontSize:12}}/>
          {pastePreview.length>0&&(()=>{
            const exist=new Set(fretes.map(f=>f.nf.trim()));
            const novos=pastePreview.filter(f=>!exist.has(f.nf.trim()));
            const dups=pastePreview.filter(f=>exist.has(f.nf.trim()));
            return <div style={{marginTop:14}}>
              <p style={{margin:"0 0 8px",fontSize:13,color:"#34d399",fontWeight:600}}>✅ {novos.length} novo(s) {dups.length>0&&<span style={{color:"#f87171"}}> · ⚠️ {dups.length} duplicata(s) serão ignoradas</span>}</p>
              <div style={{overflowX:"auto",maxHeight:200,overflowY:"auto",borderRadius:8,border:"1px solid #2a2a2a"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead><tr style={{background:"#0a0a0a"}}>{["","CT-e","Emissão","Transportadora","Valor"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#555",fontWeight:600}}>{h}</th>)}</tr></thead>
                  <tbody>{pastePreview.map((f,i)=>{const isDup=exist.has(f.nf.trim());return <tr key={i} style={{borderBottom:"1px solid #1a1a1a",opacity:isDup?0.4:1}}><td style={{padding:"6px 10px"}}>{isDup?<span style={{color:"#f87171",fontSize:11}}>DUP</span>:<span style={{color:"#34d399",fontSize:11}}>NEW</span>}</td><td style={{padding:"6px 10px",color:"#ff9999",fontWeight:600}}>{f.nf}</td><td style={{padding:"6px 10px",color:"#94a3b8"}}>{f.emissao}</td><td style={{padding:"6px 10px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.transportadora}</td><td style={{padding:"6px 10px",color:"#34d399"}}>{f.valor}</td></tr>;})}</tbody>
                </table>
              </div>
              {novos.length>0&&<button onClick={handleImport} style={{marginTop:12,background:"#059669",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>✅ Importar {novos.length} frete(s)</button>}
            </div>;
          })()}
          {pasteText&&pastePreview.length===0&&<p style={{color:"#f87171",fontSize:13,marginTop:10}}>⚠️ Não foi possível detectar fretes.</p>}
        </div>
      )}
      {showForm&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #2a2a2a"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,color:"#ff9999"}}>{editId?"✏️ Editar Frete":"🚚 Novo Frete"}</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
            {[["transportadora","Transportadora *"],["nf","Nº CT-e"],["nfAssociada","NF Vinculada"],["pedido","Nº Pedido"],["origem","Origem"],["destino","Destino"],["previsao","Previsão"],["valor","Valor (R$)"],["rastreio","Rastreio"],["chegou","Data de Chegada"]].map(([k,l])=>(
              <div key={k}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>{l}</label><input value={form[k]||""} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>
            ))}
            <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>Observações</label><input value={form.obs||""} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} style={inp}/></div>
          </div>
          <button onClick={handleSave} style={{marginTop:14,background:"#cc0000",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{editId?"💾 Salvar":"✅ Registrar"}</button>
        </div>
      )}
      <SubTabs active={sub} setActive={setSub} pendentes={pendentes.length} finalizados={finalizados.length} color="#cc0000"/>
      <div style={{display:"flex",gap:10,margin:"14px 0"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar transportadora, CT-e ou NF..." style={{flex:1,minWidth:200,background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13}}/>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
          <div style={{fontSize:44}}>{sub==="pendentes"?"🚚":"✅"}</div>
          <p style={{marginTop:10,fontSize:14}}>{sub==="pendentes"?"Nenhum frete pendente.":"Nenhum frete finalizado ainda."}</p>
        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#141414",borderBottom:"2px solid #cc0000"}}>
                {["Transportadora","CT-e","NF Vinculada","Pedido","Origem → Destino","Previsão","Valor","Rastreio","Obs","Data Chegada","Status",""].map(h=>(
                  <th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((fr,i)=>{
                const chegou=!!fr.chegou;
                return(
                  <tr key={fr.id} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>
                    <td style={{padding:"9px 12px",fontWeight:600,color:"#ff4444",whiteSpace:"nowrap"}}>{fr.transportadora}</td>
                    <td style={{padding:"9px 12px",color:"#ff9999",whiteSpace:"nowrap"}}>{fr.nf||"—"}</td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><LinkBadge value={fr.nfAssociada} placeholder="+ vincular NF" color="#60a5fa" bg="#1e3a5f" borderColor="#3b82f6" icon="🔗" onChange={v=>handleNfAssociada(fr.id,v)} onClear={()=>upd(fr.id,"nfAssociada","")}/></td>
                    <td style={{padding:"9px 12px"}}><input value={fr.pedido||""} onChange={e=>upd(fr.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",fontSize:12,whiteSpace:"nowrap"}}>{fr.origem&&fr.destino?`${fr.origem} → ${fr.destino}`:fr.origem||fr.destino||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{fr.previsao||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{fr.valor||"—"}</td>
                    <td style={{padding:"9px 12px"}}><input value={fr.rastreio||""} onChange={e=>upd(fr.id,"rastreio",e.target.value)} placeholder="Rastreio..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#c4b5fd",fontSize:12,width:100}}/></td>
                    <td style={{padding:"9px 12px"}}><input value={fr.obs||""} onChange={e=>upd(fr.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={fr.chegou} onSave={v=>handleChegou(fr.id,v)}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {chegou?<span style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:6,padding:"4px 12px",color:"#4ade80",fontWeight:700,fontSize:12}}>📦 Chegou</span>:<span style={{background:"#1c1917",border:"1px solid #f59e0b",borderRadius:6,padding:"4px 12px",color:"#fbbf24",fontWeight:700,fontSize:12}}>⏳ Pendente</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{setForm({...fr});setEditId(fr.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setFretes(prev=>prev.filter(f=>f.id!==fr.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const[tab,setTab]=useState("nf");
  const[nfs,setNfs]=useState([]);
  const[fretes,setFretes]=useState([]);
  const[dataLoaded,setDataLoaded]=useState(false); // ← guarda contra salvar antes de carregar
  const[showSettings,setShowSettings]=useState(false);
  const[sheetsUrl,setSheetsUrl]=useState(()=>localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL);
  const[urlDraft,setUrlDraft]=useState(()=>localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncMsg,setSyncMsg]=useState("");
  const isConnected=!!sheetsUrl;

  // Initial load: cloud first, then localStorage fallback
  useEffect(()=>{
    setDataLoaded(false);
    async function init(){
      if(sheetsUrl){
        setSyncStatus("syncing");setSyncMsg("Carregando dados da nuvem...");
        let cloudOk=false;
        try{
          const [cnf,cfr]=await Promise.all([cloudLoad(STORAGE_NF),cloudLoad(STORAGE_FR)]);
          if(cnf&&cnf.length>0){setNfs(cnf);cloudOk=true;}else{try{const s=localStorage.getItem(STORAGE_NF);if(s){const d=JSON.parse(s);setNfs(d.length>0?d:SEED_NFS);}else{setNfs(SEED_NFS);}}catch{setNfs(SEED_NFS);}}
          if(cfr&&cfr.length>0){setFretes(cfr);cloudOk=true;}else{try{const s=localStorage.getItem(STORAGE_FR);if(s){const d=JSON.parse(s);setFretes(d.length>0?d:SEED_FRETES);}else{setFretes(SEED_FRETES);}}catch{setFretes(SEED_FRETES);}}
        }catch{
          try{const s=localStorage.getItem(STORAGE_NF);if(s){const d=JSON.parse(s);setNfs(d.length>0?d:SEED_NFS);}else{setNfs(SEED_NFS);}}catch{setNfs(SEED_NFS);}
          try{const s=localStorage.getItem(STORAGE_FR);if(s){const d=JSON.parse(s);setFretes(d.length>0?d:SEED_FRETES);}else{setFretes(SEED_FRETES);}}catch{setFretes(SEED_FRETES);}
        }
        setSyncStatus("ok");setSyncMsg(cloudOk?"Nuvem carregada ✓":"Cache local ✓");
        setTimeout(()=>setSyncStatus("idle"),3000);
      }else{
        try{const s=localStorage.getItem(STORAGE_NF);if(s){const d=JSON.parse(s);setNfs(d.length>0?d:SEED_NFS);}else{setNfs(SEED_NFS);}}catch{setNfs(SEED_NFS);}
        try{const s=localStorage.getItem(STORAGE_FR);if(s){const d=JSON.parse(s);setFretes(d.length>0?d:SEED_FRETES);}else{setFretes(SEED_FRETES);}}catch{setFretes(SEED_FRETES);}
      }
      setDataLoaded(true);
    }
    init();
  },[sheetsUrl]);

  // Save NFs — só depois que carregou
  useEffect(()=>{
    if(!dataLoaded)return;
    try{localStorage.setItem(STORAGE_NF,JSON.stringify(nfs));}catch{}
    if(sheetsUrl){cloudSave(STORAGE_NF,nfs);}
  },[nfs,dataLoaded]);

  // Save Fretes — só depois que carregou
  useEffect(()=>{
    if(!dataLoaded)return;
    try{localStorage.setItem(STORAGE_FR,JSON.stringify(fretes));}catch{}
    if(sheetsUrl){cloudSave(STORAGE_FR,fretes);}
  },[fretes,dataLoaded]);

  const saveUrl=()=>{
    const url=urlDraft.trim();
    localStorage.setItem(STORAGE_SHEETS_URL,url);
    setSheetsUrl(url);
    setShowSettings(false);
  };

  const testConnection=async()=>{
    setSyncStatus("syncing");setSyncMsg("Testando conexão...");
    const url=urlDraft.trim();
    try{
      const r=await fetch(`${url}?key=test`);
      await r.text();
      setSyncStatus("ok");setSyncMsg("Conexão OK! ✓");
    }catch{
      setSyncStatus("error");setSyncMsg("Falha na conexão ✗");
    }
    setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},4000);
  };

  const tabs=[{id:"nf",label:"🧾 NF-e",color:"#cc0000"},{id:"fretes",label:"🚚 Fretes",color:"#ff4444"},{id:"pedidos",label:"📦 Pedidos",color:"#f59e0b"}];

  const syncDot={idle:{c:"#334155",t:"Sem nuvem"},syncing:{c:"#fbbf24",t:"Sincronizando..."},ok:{c:"#4ade80",t:"Nuvem OK"},error:{c:"#f87171",t:"Erro na nuvem"}};
  const sd=syncDot[syncStatus];

  return(
    <div style={{fontFamily:"'Barlow','Segoe UI',sans-serif",background:"#0a0a0a",minHeight:"100vh",color:"#e2e8f0"}}>
      {/* Settings Modal */}
      {showSettings&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

{`function doGet(e){
  const key=e.parameter.key;
  if(!key||key==="test")return out("ok");
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  let sh=ss.getSheetByName("MasterEPI");
  if(!sh)sh=ss.insertSheet("MasterEPI");
  const rows=sh.getDataRange().getValues();
  for(let r of rows){if(r[0]===key)return out(r[1]);}
  return out("null");
}
function doPost(e){
  try{
    const raw=e.postData?e.postData.contents:"{}";
    const b=JSON.parse(raw);
    if(!b.key)return out("error:no key");
    const val=JSON.stringify(b.value);
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    let sh=ss.getSheetByName("MasterEPI");
    if(!sh)sh=ss.insertSheet("MasterEPI");
    const data=sh.getDataRange().getValues();
    for(let i=0;i<data.length;i++){
      if(data[i][0]===b.key){
        sh.getRange(i+1,2).setValue(val);
        SpreadsheetApp.flush();
        return out("ok");
      }
    }
    sh.appendRow([b.key,val]);
    SpreadsheetApp.flush();
    return out("ok");
  }catch(err){return out("error:"+err.toString());}
}
function out(v){
  return ContentService.createTextOutput(v)
    .setMimeType(ContentService.MimeType.TEXT);
}`}

    setNovaSol({cod, descricao: desc, data: `${dd}/${mm}/${yyyy}`});
  };

  const addSolicitacao = () => {
    if (!novaSol.cod.trim()) return;
    const desc = novaSol.descricao || catalogo[novaSol.cod.trim()] || "⚠️ CÓDIGO NÃO CADASTRADO";
    setSolicitacoes(prev => [{...novaSol, descricao:desc, resposta:"", dataResposta:""}, ...prev]);
    setNovaSol({cod:"", descricao:"", data:""});
  };

  const updSol = (i, field, val) => setSolicitacoes(prev => prev.map((s,idx) => idx===i ? {...s, [field]:val} : s));
  const [toast, setToast] = useState(null);
  const showToast = (m) => { setToast(m); setTimeout(()=>setToast(null), 3500); };

  // Carrega: nuvem → localStorage → dados padrão
  useEffect(() => {
    loadedRef.current = false;
    async function init() {
      if (sheetsUrl) {
        setSyncPed("syncing");
        const cloud = await cloudLoad(STORAGE_PED);
        if (cloud && cloud.length > 0) {
          loadedRef.current = true;
          setPedidos(cloud);
          setSyncPed("ok");
          setTimeout(()=>setSyncPed("idle"),2500);
          return;
        }
      }
      try {
        const s = localStorage.getItem(STORAGE_PED);
        if (s) {
          const parsed = JSON.parse(s);
          if (parsed && parsed.length > 0) {
            loadedRef.current = true;
            setPedidos(parsed);
            setSyncPed("idle");
            return;
          }
        }
      } catch {}
      // Sem dados em lugar nenhum — usa dados da planilha importada
      loadedRef.current = true;
      setPedidos(PLANILHA_DATA.pedidos.map((p,i) => ({...p, _id: i+1})));
      setSyncPed("idle");
    }
    async function initSol() {
      if (sheetsUrl) {
        const cloud = await cloudLoad(STORAGE_SOL);
        if (cloud) { solLoadedRef.current = true; setSolicitacoes(cloud); return; }
      }
      try {
        const s = localStorage.getItem(STORAGE_SOL);
        if (s) { solLoadedRef.current = true; setSolicitacoes(JSON.parse(s)); return; }
      } catch {}
      solLoadedRef.current = true;
      setSolicitacoes(PLANILHA_DATA.solicitacoes || []);
    }
    init();
    initSol();
  }, [sheetsUrl]);

  // Salva só depois de carregar — dependência só em [pedidos]
  useEffect(() => {
    if (!loadedRef.current) return;
    try { localStorage.setItem(STORAGE_PED, JSON.stringify(pedidos)); } catch {}
    if (sheetsUrl) { cloudSave(STORAGE_PED, pedidos); }
  }, [pedidos]);

  useEffect(() => {
    if (!solLoadedRef.current) return;
    try { localStorage.setItem(STORAGE_SOL, JSON.stringify(solicitacoes)); } catch {}
    if (sheetsUrl) { cloudSave(STORAGE_SOL, solicitacoes); }
  }, [solicitacoes]);

  function parsePedidosText(raw, forn) {
    raw = raw.replace(/__ABRIR PDF__/gi,'').replace(/[🟢🔴🟠🟡⚫⚪🔵🟣✅❌⚠️🧡💛💚💙💜🖤🤍🔶🔷🔸🔹]/g,'').trim();
    const items = [];
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    for (const line of lines) {
      const cols = line.split('\t');
      if (cols.length >= 5) {
        // ── Formato tabulado (3M) ──────────────────────────────────────
        const data=cols[0]?.trim()||'', cod=cols[1]?.trim()||'', desc=cols[2]?.trim()||'';
        const qtd=cols[3]?.trim()||'', sal=cols[4]?.trim()||'';
        let ultEnt='';
        for(let i=5;i<Math.min(cols.length,9);i++){if(/\d{2}\/\d{2}\/\d{4}/.test(cols[i])){ultEnt=cols[i].trim();break;}}
        let vend='', ped='';
        for(let i=cols.length-1;i>=0;i--){const c=cols[i].trim();if(/^\d{6,12}$/.test(c)&&!/^\d{2}$/.test(c)){ped=c;break;}}
        for(let i=7;i<cols.length;i++){const c=cols[i]?.trim()||'';if(c&&!/^\d/.test(c)&&c.length>2&&!c.includes('/')&&!c.includes('ABRIR')){vend=c;break;}}
        if(cod&&desc) items.push({fornecedor:forn||'',dataSolicitacao:data,cod,descricao:desc,qtdSugerida:qtd,saldoEstoque:sal,dataUltimaEntrada:ultEnt,quantItem:'',saldoMinimo:'',codVendedor:'',vendedor:vend,contato:'',dataAprovacao:'',numeroPedido:ped,faturouDia:'',nf:'',chegouDia:'',aprovFaturamento:'',fatEntrada:'',valor:''});
      } else {
        // ── Formato concatenado (BRACOL/MAICOL) ───────────────────────
        const segs = line.split(/(?=\d{2}\/\d{2}\/\d{4}\d{4}[A-ZÁÀÃÂÉÊÍÓÔÕÚ])/);
        for (const seg of segs) {
          const dm = seg.match(/^(\d{2}\/\d{2}\/\d{4})/);
          if(!dm) continue;
          const data=dm[1], rest=seg.slice(10);
          const cod=rest.substring(0,4), afterCod=rest.slice(4);
          const caM=afterCod.match(/CA\d{3,6}/i);
          let descricao=afterCod, afterDesc='';
          if(caM&&caM.index!==undefined){const e=caM.index+caM[0].length;descricao=afterCod.slice(0,e).trim();afterDesc=afterCod.slice(e);}
          else{const nm=afterCod.match(/\s\d+[\s\r]/);if(nm){descricao=afterCod.slice(0,nm.index).trim();afterDesc=afterCod.slice(nm.index);}else{descricao=afterCod.slice(0,60).trim();afterDesc=afterCod.slice(60);}}
          const nums=(afterDesc.match(/\b\d+\b/g)||[]);
          const qtdSugerida=nums[0]||'', saldoEstoque=nums[1]||'';
          const deM=afterDesc.match(/\d{2}\/\d{2}\/\d{4}/);
          const dataUltimaEntrada=deM?deM[0]:'';
          const bigN=afterDesc.match(/\b\d{6,10}\b/);
          const numeroPedido=bigN?bigN[0]:'';
          const vendM=afterDesc.match(/\b([A-ZÁÀÃÂÉÊÍÓÔÕÚ][a-záàãâéêíóôõú]{2,}(?:\s[A-ZÁÀÃÂÉÊÍÓÔÕÚ][a-záàãâéêíóôõú]{2,})?)\b/);
          const vendedor=vendM?vendM[1]:'';
          if(cod&&descricao) items.push({fornecedor:forn||'',dataSolicitacao:data,cod,descricao,qtdSugerida,saldoEstoque,dataUltimaEntrada,quantItem:'',saldoMinimo:'',codVendedor:'',vendedor,contato:'',dataAprovacao:'',numeroPedido,faturouDia:'',nf:'',chegouDia:'',aprovFaturamento:'',fatEntrada:'',valor:''});
        }
      }
    }
    return items;
  }
  const handleImportConfirm = () => {
    if(!importPreview.length) return;
    const maxId=pedidos.reduce((m,p)=>Math.max(m,p._id||0),0);
    const news=importPreview.map((p,i)=>({...p,_id:maxId+i+1}));
    setPedidos(prev=>[...prev,...news]);
    setShowImport(false);setImportText('');setImportPreview([]);setImportForn('');
    showToast(`✅ ${news.length} item(ns) importado(s)!`);
  };

  const upd = (id, field, value) => setPedidos(prev => prev.map(p => p._id===id ? {...p, [field]:value} : p));

  const fornecedores = [...new Set(pedidos.map(p => p.fornecedor).filter(Boolean))].sort();

  const abertos = pedidos.filter(p => !p.chegouDia);
  const finalizados = pedidos.filter(p => !!p.chegouDia);
  const base = sub === "abertos" ? abertos : finalizados;

  const filtered = base.filter(p => {
    const mf = filterForn === "todos" || p.fornecedor === filterForn;
    const ms = filterStatus === "todos" ||
      (filterStatus === "sem_nf" && !p.nf) ||
      (filterStatus === "com_nf" && !!p.nf) ||
      (filterStatus === "sem_pedido" && !p.numeroPedido);
    const mq = !search ||
      p.descricao?.toLowerCase().includes(search.toLowerCase()) ||
      p.cod?.includes(search) ||
      (p.numeroPedido||"").includes(search) ||
      (p.nf||"").includes(search);
    return mf && ms && mq;
  });

  const inp = (w) => ({background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"3px 6px",color:"#e2e8f0",fontSize:12,width:w||80});

  // Status badge
  const getStatus = (p) => {
    if (p.chegouDia) return {label:"Recebido", color:"#4ade80", bg:"#052e16", border:"#16a34a"};
    if (p.nf) return {label:"Faturado", color:"#67e8f9", bg:"#0c2a3a", border:"#0891b2"};
    if (p.faturouDia) return {label:"Faturando", color:"#fbbf24", bg:"#1c1200", border:"#ca8a04"};
    if (p.numeroPedido) return {label:"Pedido Feito", color:"#a5b4fc", bg:"#1e1b4b", border:"#4f46e5"};
    if (p.dataAprovacao) return {label:"Aprovado", color:"#fb923c", bg:"#1c0a00", border:"#ea580c"};
    if (p.dataSolicitacao) return {label:"Solicitado", color:"#94a3b8", bg:"#1a1a1a", border:"#334155"};
    return {label:"—", color:"#555", bg:"#111", border:"#222"};
  };

  return (
    <div>
      {toast && <div style={{position:"fixed",top:20,right:20,background:"#065f46",color:"#fff",padding:"12px 20px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:998,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}

      {/* Sync status banner */}
      {syncPed!=="idle" && (
        <div style={{display:"flex",alignItems:"center",gap:8,background:syncPed==="syncing"?"#1c1200":"#052e16",border:`1px solid ${syncPed==="syncing"?"#ca8a04":"#16a34a"}`,borderRadius:8,padding:"8px 16px",marginBottom:14,fontSize:12,color:syncPed==="syncing"?"#fbbf24":"#4ade80",fontWeight:600}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:syncPed==="syncing"?"#fbbf24":"#4ade80",display:"inline-block"}}/>
          {syncPed==="syncing"?"☁️ Carregando pedidos da nuvem...":"☁️ Pedidos sincronizados ✓"}
        </div>
      )}

      {/* Counters */}
      <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        {[
          ["📦","Em Aberto","#fbbf24",abertos.length],
          ["✅","Recebidos","#34d399",finalizados.length],
          ["📋","Total","#fff",pedidos.length],
          ["⚠️","Sem NF",  "#f87171",abertos.filter(p=>p.numeroPedido&&!p.nf).length],
        ].map(([ic,lb,cl,ct]) => (
          <div key={lb} style={{background:"#141414",borderRadius:8,padding:"10px 18px",display:"flex",alignItems:"center",gap:8,border:"1px solid #2a2a2a"}}>
            <span>{ic}</span><span style={{fontSize:13,color:"#94a3b8"}}>{lb}</span><span style={{fontWeight:700,fontSize:20,color:cl}}>{ct}</span>
          </div>
        ))}
      </div>

      {/* Sub tabs */}
      <div style={{display:"flex",gap:2,borderBottom:"1px solid #2a2a2a",marginBottom:14}}>
        {[["abertos","⏳ Em Aberto",abertos.length,"#fbbf24"],["finalizados","✅ Recebidos",finalizados.length,"#34d399"],["solicitacoes","📋 Solicitações",solicitacoes.length,"#a78bfa"]].map(([id,label,count,color])=>(
          <button key={id} onClick={()=>setSub(id)} style={{padding:"7px 18px",border:"none",borderRadius:"6px 6px 0 0",cursor:"pointer",fontWeight:600,fontSize:13,background:sub===id?"#0a0a0a":"transparent",color:sub===id?color:"#555",borderBottom:sub===id?`2px solid ${color}`:"2px solid transparent"}}>
            {label} <span style={{background:color,color:"#000",borderRadius:10,padding:"1px 7px",fontSize:11,marginLeft:4,fontWeight:700}}>{count}</span>
          </button>
        ))}
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar produto, código, pedido ou NF..."
          style={{flex:1,minWidth:200,background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13}}/>
        <select value={filterForn} onChange={e=>setFilterForn(e.target.value)}
          style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 12px",color:"#e2e8f0",fontSize:12,maxWidth:180}}>
          <option value="todos">Todos fornecedores</option>
          {fornecedores.map(f=><option key={f} value={f}>{f}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
          style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 12px",color:"#e2e8f0",fontSize:12}}>
          <option value="todos">Todos status</option>
          <option value="sem_pedido">Sem nº pedido</option>
          <option value="sem_nf">Pedido feito / sem NF</option>
          <option value="com_nf">Com NF</option>
        </select>
        <button onClick={()=>setShowImport(true)} style={{background:"#1e3a1e",border:"1px solid #16a34a",borderRadius:8,padding:"8px 14px",color:"#4ade80",fontSize:13,cursor:"pointer",fontWeight:700,whiteSpace:"nowrap"}}>📥 Importar</button>
        <button onClick={()=>{if(confirm("Apagar TODOS os pedidos? Isso não pode ser desfeito."))setPedidos([]);}} style={{background:"#1a0a0a",border:"1px solid #7f1d1d",borderRadius:8,padding:"8px 14px",color:"#f87171",fontSize:13,cursor:"pointer",fontWeight:700,whiteSpace:"nowrap"}}>🗑️ Apagar Todos</button>
      </div>

      {/* Modal importação */}
      {showImport && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"#141414",border:"1px solid #16a34a",borderRadius:12,padding:24,width:"100%",maxWidth:680,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <span style={{color:"#4ade80",fontWeight:700,fontSize:16}}>📥 Importar Pedidos</span>
              <button onClick={()=>{setShowImport(false);setImportText('');setImportPreview([]);setImportForn('');}} style={{background:"transparent",border:"1px solid #333",borderRadius:6,color:"#94a3b8",padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕ Fechar</button>
            </div>
            <div style={{marginBottom:12}}>
              <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>FORNECEDOR (nome do grupo)</label>
              <input value={importForn} onChange={e=>setImportForn(e.target.value)} placeholder="Ex: BRACOL DUBAI MARROM 500V"
                style={{width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:7,padding:"8px 12px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"}}/>
            </div>
            <div style={{marginBottom:12}}>
              <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>COLE O TEXTO DO PEDIDO AQUI</label>
              <textarea value={importText} onChange={e=>setImportText(e.target.value)} rows={7}
                placeholder={"Cole aqui o texto copiado do sistema (funciona com formato BRACOL/MAICOL e também com 3M tabulado)"}
                style={{width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:7,padding:"10px 12px",color:"#e2e8f0",fontSize:12,boxSizing:"border-box",resize:"vertical",fontFamily:"monospace"}}/>
            </div>
            <button onClick={()=>setImportPreview(parsePedidosText(importText,importForn))}
              style={{background:"#1e3a1e",border:"1px solid #16a34a",borderRadius:7,padding:"9px 20px",color:"#4ade80",fontWeight:700,fontSize:13,cursor:"pointer",marginRight:10}}>
              🔍 Analisar
            </button>
            {importPreview.length>0 && (
              <>
                <div style={{margin:"14px 0 8px",color:"#4ade80",fontSize:13,fontWeight:700}}>
                  {importPreview.length} item(ns) detectado(s) — confira antes de importar:
                </div>
                <div style={{overflowX:"auto",marginBottom:14}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead>
                      <tr style={{background:"#1a1a1a",borderBottom:"2px solid #16a34a"}}>
                        {["Data","Cód","Descrição","Qtd","Saldo","Últ.Ent","Vendedor","Nº Pedido"].map(h=>(
                          <th key={h} style={{padding:"6px 8px",textAlign:"left",color:"#64748b",fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {importPreview.map((p,i)=>(
                        <tr key={i} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>
                          <td style={{padding:"5px 8px",color:"#64748b",whiteSpace:"nowrap"}}>{p.dataSolicitacao}</td>
                          <td style={{padding:"5px 8px",color:"#94a3b8",fontWeight:700}}>{p.cod}</td>
                          <td style={{padding:"5px 8px",color:"#e2e8f0",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={p.descricao}>{p.descricao}</td>
                          <td style={{padding:"5px 8px",color:"#fbbf24",textAlign:"center"}}>{p.qtdSugerida||"—"}</td>
                          <td style={{padding:"5px 8px",color:"#34d399",textAlign:"center"}}>{p.saldoEstoque||"—"}</td>
                          <td style={{padding:"5px 8px",color:"#64748b",whiteSpace:"nowrap"}}>{p.dataUltimaEntrada||"—"}</td>
                          <td style={{padding:"5px 8px",color:"#a5b4fc",whiteSpace:"nowrap"}}>{p.vendedor||"—"}</td>
                          <td style={{padding:"5px 8px",color:"#fbbf24",whiteSpace:"nowrap"}}>{p.numeroPedido||"—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <button onClick={handleImportConfirm}
                  style={{background:"#065f46",border:"1px solid #16a34a",borderRadius:7,padding:"10px 24px",color:"#4ade80",fontWeight:700,fontSize:14,cursor:"pointer"}}>
                  ✅ Confirmar e Importar {importPreview.length} item(ns)
                </button>
              </>
            )}
          </div>
        </div>
      )}

      <p style={{fontSize:12,color:"#555",marginBottom:10}}>{filtered.length} item(ns) exibido(s)</p>

      {filtered.length === 0 ? (
        <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
          <div style={{fontSize:44}}>📦</div>
          <p style={{marginTop:10,fontSize:14}}>Nenhum pedido encontrado.</p>
        </div>
      ) : (
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#141414",borderBottom:"2px solid #cc0000"}}>
                {["Fornecedor","Cód","Descrição","Qtd","Saldo","Últ.Entrada","Vendedor","Solicitado","Nº Pedido","Faturou","NF","Chegou","Status",""].map(h=>(
                  <th key={h} style={{padding:"8px 10px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:11,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((p,i) => {
                const st = getStatus(p);
                return (
                  <tr key={p._id} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>
                    <td style={{padding:"7px 10px",color:"#cc0000",fontWeight:700,whiteSpace:"nowrap",fontSize:11}}>{p.fornecedor}</td>
                    <td style={{padding:"7px 10px",color:"#94a3b8",whiteSpace:"nowrap"}}>{p.cod}</td>
                    <td style={{padding:"7px 10px",maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={p.descricao}>{p.descricao}</td>
                    <td style={{padding:"7px 10px",color:"#fbbf24",textAlign:"center"}}>{p.qtdSugerida||"—"}</td>
                    <td style={{padding:"7px 10px",color:parseInt(p.saldoEstoque||"1")<=0?"#f87171":"#34d399",textAlign:"center",fontWeight:700}}>{p.saldoEstoque||"—"}</td>
                    <td style={{padding:"7px 10px",color:"#64748b",whiteSpace:"nowrap",fontSize:11}}>{p.dataUltimaEntrada||"—"}</td>
                    <td style={{padding:"7px 10px",color:"#a5b4fc",whiteSpace:"nowrap",fontSize:11}}>{p.vendedor||"—"}</td>
                    <td style={{padding:"7px 10px",color:"#64748b",whiteSpace:"nowrap",fontSize:11}}>{p.dataSolicitacao||"—"}</td>
                    <td style={{padding:"7px 10px"}}>
                      <input value={p.numeroPedido||""} onChange={e=>upd(p._id,"numeroPedido",e.target.value)}
                        placeholder="Nº pedido..." style={inp(90)}/>
                    </td>
                    <td style={{padding:"7px 10px"}}>
                      <input value={p.faturouDia||""} onChange={e=>upd(p._id,"faturouDia",e.target.value)}
                        placeholder="dd/mm/aaaa" style={{...inp(90),color:"#fbbf24"}}/>
                    </td>
                    <td style={{padding:"7px 10px"}}>
                      <input value={p.nf||""} onChange={e=>upd(p._id,"nf",e.target.value)}
                        placeholder="NF..." style={{...inp(70),color:"#67e8f9"}}/>
                    </td>
                    <td style={{padding:"7px 10px"}}>
                      <input value={p.chegouDia||""} onChange={e=>upd(p._id,"chegouDia",e.target.value)}
                        placeholder="dd/mm/aaaa" style={{...inp(90),color:"#4ade80"}}/>
                    </td>
                    <td style={{padding:"7px 10px",whiteSpace:"nowrap"}}>
                      <span style={{background:st.bg,border:`1px solid ${st.border}`,borderRadius:6,padding:"3px 8px",color:st.color,fontWeight:700,fontSize:10}}>{st.label}</span>
                    </td>
                    <td style={{padding:"7px 6px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{if(confirm("Remover este item?"))setPedidos(prev=>prev.filter(x=>x._id!==p._id));}} style={{background:"transparent",border:"1px solid #3a1a1a",borderRadius:5,color:"#cc0000",padding:"3px 7px",cursor:"pointer",fontSize:11}} title="Remover">🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Solicitações */}
      {sub === "solicitacoes" && (
        <div>
          {/* Formulário nova solicitação */}
          <div style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:10,padding:"16px 18px",marginBottom:18}}>
            <div style={{color:"#a78bfa",fontWeight:700,fontSize:13,marginBottom:12}}>➕ Nova Solicitação</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div>
                <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>Código</label>
                <input value={novaSol.cod} onChange={e=>handleCodChange(e.target.value)}
                  placeholder="Ex: 3620"
                  style={{background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"8px 12px",color:"#e2e8f0",fontSize:13,width:100}}/>
              </div>
              <div style={{flex:1,minWidth:200}}>
                <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>Descrição</label>
                <input value={novaSol.descricao} onChange={e=>setNovaSol(s=>({...s,descricao:e.target.value}))}
                  placeholder="Preenchido automático pelo código..."
                  style={{width:"100%",background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"8px 12px",color:novaSol.descricao?"#e2e8f0":"#555",fontSize:13,boxSizing:"border-box"}}/>
              </div>
              <div>
                <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>Data</label>
                <input value={novaSol.data} onChange={e=>setNovaSol(s=>({...s,data:e.target.value}))}
                  placeholder="dd/mm/aaaa"
                  style={{background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"8px 12px",color:"#fbbf24",fontSize:13,width:110}}/>
              </div>
              <button onClick={addSolicitacao}
                style={{background:"#7c3aed",color:"#fff",border:"none",borderRadius:7,padding:"9px 20px",cursor:"pointer",fontWeight:700,fontSize:13}}>
                Solicitar
              </button>
            </div>
            {novaSol.cod && !catalogo[String(novaSol.cod).trim()] && (
              <div style={{color:"#f87171",fontSize:12,marginTop:8}}>⚠️ Código não encontrado no catálogo — verifique ou preencha a descrição manualmente</div>
            )}
          </div>

          {/* Lista */}
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{background:"#141414",borderBottom:"2px solid #7c3aed"}}>
                  {["Data","Cód","Descrição","Resposta","Data Resp","Ação"].map(h=>(
                    <th key={h} style={{padding:"8px 10px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:11,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {solicitacoes.map((s,i)=>{
                  const rColor = s.resposta==="COMPRADO / PEDIDO FEITO"?"#34d399":s.resposta==="EM COTAÇÃO"?"#fbbf24":s.resposta==="FALTA NO FORNECEDOR"?"#f87171":s.resposta==="CHEGOU"?"#67e8f9":"#555";
                  return (
                    <tr key={i} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>
                      <td style={{padding:"7px 10px",color:"#64748b",whiteSpace:"nowrap"}}>{s.data}</td>
                      <td style={{padding:"7px 10px",color:"#94a3b8",fontWeight:700}}>{s.cod}</td>
                      <td style={{padding:"7px 10px",color:"#e2e8f0",maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={s.descricao}>{s.descricao}</td>
                      <td style={{padding:"7px 10px"}}>
                        <select value={s.resposta||""} onChange={e=>updSol(i,"resposta",e.target.value)}
                          style={{background:"#141414",border:`1px solid ${rColor}`,borderRadius:6,padding:"4px 8px",color:rColor,fontWeight:700,fontSize:11,cursor:"pointer"}}>
                          <option value="">— sem resposta —</option>
                          <option value="EM COTAÇÃO">EM COTAÇÃO</option>
                          <option value="COMPRADO / PEDIDO FEITO">COMPRADO / PEDIDO FEITO</option>
                          <option value="FALTA NO FORNECEDOR">FALTA NO FORNECEDOR</option>
                          <option value="CHEGOU">CHEGOU</option>
                        </select>
                      </td>
                      <td style={{padding:"7px 10px"}}>
                        <input value={s.dataResposta||""} onChange={e=>updSol(i,"dataResposta",e.target.value)}
                          placeholder="dd/mm/aaaa"
                          style={{background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 7px",color:"#4ade80",fontSize:11,width:90}}/>
                      </td>
                      <td style={{padding:"7px 10px"}}>
                        <button onClick={()=>setSolicitacoes(prev=>prev.filter((_,idx)=>idx!==i))}
                          style={{background:"transparent",border:"1px solid #3a1a1a",borderRadius:5,color:"#cc0000",padding:"3px 8px",cursor:"pointer",fontSize:11}}>✕</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Contatos section */}
      <div style={{marginTop:30,borderTop:"1px solid #1a1a1a",paddingTop:20}}>
        <h3 style={{color:"#cc0000",fontSize:14,fontWeight:700,marginBottom:12}}>📞 Fornecedores / Contatos</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
          {contatos.map(c=>(
            <div key={c.cod} style={{background:"#141414",borderRadius:8,padding:"12px 14px",border:"1px solid #2a2a2a"}}>
              <div style={{fontWeight:700,color:"#cc0000",fontSize:13}}>{c.empresa}</div>
              <div style={{color:"#94a3b8",fontSize:12,marginTop:3}}>{c.vendedor}</div>
              <div style={{color:"#fbbf24",fontSize:12,marginTop:2}}>{c.telefone}</div>
              {c.fatMin&&<div style={{color:"#555",fontSize:11,marginTop:2}}>Mín: R$ {c.fatMin}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

                              <tr style={{background:"#141414",borderBottom:"1px solid #2a2a2a"}}>
                                {["Cód","Descrição","Qtd Sug.","Saldo Est.","Vlr Unit."].map(h=>(
                                  <th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#555",fontWeight:600}}>{h}</th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {g.itens.map((it,i)=>(
                                <tr key={i} style={{borderBottom:"1px solid #1a1a1a"}}>
                                  <td style={{padding:"5px 10px",color:"#fbbf24",fontWeight:700}}>{it.cod}</td>
                                  <td style={{padding:"5px 10px",color:"#e2e8f0",maxWidth:320,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={it.descricao}>{it.descricao}</td>
                                  <td style={{padding:"5px 10px",color:"#cc0000",textAlign:"center"}}>{it.qtdSugerida||"—"}</td>
                                  <td style={{padding:"5px 10px",color:parseInt(it.saldoEstoque||"1")<=0?"#f87171":"#34d399",textAlign:"center",fontWeight:700}}>{it.saldoEstoque||"—"}</td>
                                  <td style={{padding:"3px 6px",textAlign:"right"}}>
                                    <input
                                      value={it.vlrUnit||""}
                                      onChange={e=>{
                                        const val=e.target.value;
                                        setGrupos(prev=>prev.map(gr=>gr._gid===g._gid?{...gr,itens:gr.itens.map((item,idx)=>idx===i?{...item,vlrUnit:val}:item)}:gr));
                                      }}
                                      placeholder="R$"
                                      style={{width:80,background:"transparent",border:"1px solid #1e3a1e",borderRadius:4,padding:"3px 6px",color:"#34d399",fontSize:11,textAlign:"right",outline:"none"}}
                                    />
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      ):(
                        <p style={{color:"#334155",fontSize:12,textAlign:"center",padding:"10px 0"}}>Nenhum item cadastrado neste pedido.</p>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )
      )}

      {sub==="solicitacoes"&&(
        <div>
          <div style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:10,padding:"16px 18px",marginBottom:18}}>
            <div style={{color:"#a78bfa",fontWeight:700,fontSize:13,marginBottom:12}}>➕ Nova Solicitação</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div>
                <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>Código</label>
                <input value={novaSol.cod}
                  onChange={e=>{const cod=e.target.value;const d=new Date();setNovaSol({cod,descricao:catalogo[cod.trim()]||"",data:`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`});}}
                  placeholder="Ex: 3620"
                  style={{background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"8px 12px",color:"#e2e8f0",fontSize:13,width:100}}/>
              </div>
              <div style={{flex:1,minWidth:200}}>
                <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>Descrição</label>
                <input value={novaSol.descricao} onChange={e=>setNovaSol(s=>({...s,descricao:e.target.value}))} placeholder="Preenchido pelo código..."
                  style={{width:"100%",background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"8px 12px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"}}/>
              </div>
              <div>
                <label style={{color:"#64748b",fontSize:11,display:"block",marginBottom:4}}>Data</label>
                <input value={novaSol.data} onChange={e=>setNovaSol(s=>({...s,data:e.target.value}))}
                  style={{background:"#0a0a0a",border:"1px solid #334155",borderRadius:7,padding:"8px 12px",color:"#fbbf24",fontSize:13,width:110}}/>
              </div>
              <button onClick={addSol} style={{background:"#7c3aed",color:"#fff",border:"none",borderRadius:7,padding:"9px 20px",cursor:"pointer",fontWeight:700,fontSize:13}}>Solicitar</button>
            </div>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{background:"#141414",borderBottom:"2px solid #7c3aed"}}>
                  {["Data","Cód","Descrição","Resposta","Data Resp",""].map(h=>(
                    <th key={h} style={{padding:"8px 10px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:11,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {solicitacoes.map((s,i)=>{
                  const rc=s.resposta==="COMPRADO / PEDIDO FEITO"?"#34d399":s.resposta==="EM COTAÇÃO"?"#fbbf24":s.resposta==="FALTA NO FORNECEDOR"?"#f87171":s.resposta==="CHEGOU"?"#67e8f9":"#555";
                  return(
                    <tr key={i} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>
                      <td style={{padding:"7px 10px",color:"#64748b",whiteSpace:"nowrap"}}>{s.data}</td>
                      <td style={{padding:"7px 10px",color:"#94a3b8",fontWeight:700}}>{s.cod}</td>
                      <td style={{padding:"7px 10px",maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={s.descricao}>{s.descricao}</td>
                      <td style={{padding:"7px 10px"}}>
                        <select value={s.resposta||""} onChange={e=>updSol(i,"resposta",e.target.value)}
                          style={{background:"#141414",border:`1px solid ${rc}`,borderRadius:6,padding:"4px 8px",color:rc,fontWeight:700,fontSize:11,cursor:"pointer"}}>
                          <option value="">— sem resposta —</option>
                          <option value="EM COTAÇÃO">EM COTAÇÃO</option>
                          <option value="COMPRADO / PEDIDO FEITO">COMPRADO / PEDIDO FEITO</option>
                          <option value="FALTA NO FORNECEDOR">FALTA NO FORNECEDOR</option>
                          <option value="CHEGOU">CHEGOU</option>
                        </select>
                      </td>
                      <td style={{padding:"7px 10px"}}>
                        <input value={s.dataResposta||""} onChange={e=>updSol(i,"dataResposta",e.target.value)} placeholder="dd/mm/aaaa"
                          style={{background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 7px",color:"#4ade80",fontSize:11,width:90}}/>
                      </td>
                      <td style={{padding:"7px 10px"}}>
                        <button onClick={()=>setSolicitacoes(prev=>prev.filter((_,idx)=>idx!==i))}
                          style={{background:"transparent",border:"1px solid #3a1a1a",borderRadius:5,color:"#cc0000",padding:"3px 8px",cursor:"pointer",fontSize:11}}>✕</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div style={{marginTop:30,borderTop:"1px solid #1a1a1a",paddingTop:20}}>
        <h3 style={{color:"#cc0000",fontSize:14,fontWeight:700,marginBottom:12}}>📞 Fornecedores / Contatos</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
          {PLANILHA_DATA.contatos.map(c=>(
            <div key={c.cod} style={{background:"#141414",borderRadius:8,padding:"12px 14px",border:"1px solid #2a2a2a"}}>
              <div style={{fontWeight:700,color:"#cc0000",fontSize:13}}>{c.empresa}</div>
              <div style={{color:"#94a3b8",fontSize:12,marginTop:3}}>{c.vendedor}</div>
              <div style={{color:"#fbbf24",fontSize:12,marginTop:2}}>{c.telefone}</div>
              {c.fatMin&&<div style={{color:"#555",fontSize:11,marginTop:2}}>Mín: R$ {c.fatMin}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
